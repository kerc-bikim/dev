<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일괄 적용 시퀀스</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>검토 후 파일 트랜잭션, 기동은 그 다음 버튼</h1>
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compose-apply-title compose-apply-desc">
      <title id="compose-apply-title">일괄 적용 시퀀스</title>
      <desc id="compose-apply-desc">브라우저가 구성 보드 JSON 을 보내면 FastAPI 가 검증하고 스냅샷한 뒤 bin 과 params 를 한 트랜잭션으로 기록한다. startstop 은 적용과 분리된 시작 버튼이다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="160" y1="88" x2="160" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="88" x2="500" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="88" x2="840" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <text x="160" y="72" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">구성 보드</text>
      <text x="500" y="72" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">FastAPI</text>
      <text x="840" y="72" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">params · bin</text>

      <rect x="496" y="128" width="8" height="280" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <line x1="160" y1="136" x2="496" y2="136" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="328" y="124" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">POST /compose/validate</text>

      <path d="M 508 176 L 560 176 L 560 200 L 508 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="620" y="192" fill="#4f5d75" font-size="11" font-family="'Geist', 'Noto Sans KR', sans-serif">포트 · 이름 · 링 검사</text>

      <line x1="160" y1="232" x2="496" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="328" y="220" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">POST /compose/apply</text>

      <line x1="504" y1="280" x2="836" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="670" y="268" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist', 'Noto Sans KR', sans-serif">스냅샷 후 bin 복사 · .d · ID</text>

      <rect x="836" y="320" width="8" height="48" fill="rgba(235,108,54,0.20)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="840" y="388" text-anchor="middle" fill="#eb6c36" font-size="11" font-family="'Geist', 'Noto Sans KR', sans-serif">실패 시 이 적용만 롤백</text>

      <line x1="496" y1="424" x2="160" y2="424" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="328" y="412" text-anchor="middle" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace">revision · 배지</text>

      <line x1="160" y1="472" x2="496" y2="472" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="328" y="460" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">시작 (별 버튼) → startstop</text>
    </svg>
  </div>
</body>
</html>
