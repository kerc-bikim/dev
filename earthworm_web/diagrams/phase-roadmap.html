<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단계 지도와 MVP</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Roadmap · Diagram Design</p>
    <h1>전제는 이미 있고, MVP는 카탈로그와 구성 보드다</h1>
    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phase-roadmap-title phase-roadmap-desc">
      <title id="phase-roadmap-title">단계 지도와 MVP</title>
      <desc id="phase-roadmap-desc">1·2단계와 로그·스니프는 기존 코드다. MVP는 3단계 스키마와 4단계 한 창 적용이다. 5단계 getmenu와 6단계 배포는 이후다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="40" y="24" width="200" height="120" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
      <text x="140" y="52" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">P1 · DONE</text>
      <text x="140" y="80" text-anchor="middle" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">1 마법사</text>
      <text x="140" y="108" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">링 · Inst · params</text>

      <line x1="240" y1="84" x2="280" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="280" y="24" width="200" height="120" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
      <text x="380" y="52" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">P2 · DONE</text>
      <text x="380" y="80" text-anchor="middle" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">2 제어</text>
      <text x="380" y="108" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">startstop · 대시보드</text>

      <rect x="40" y="168" width="920" height="196" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="64" y="196" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">MVP</text>

      <rect x="64" y="216" width="400" height="120" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
      <text x="264" y="248" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">P3 · NEW</text>
      <text x="264" y="276" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">3 카탈로그 · 스키마</text>
      <text x="264" y="304" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">우선 12 · fleet · 시드 스텁</text>

      <line x1="464" y1="276" x2="520" y2="276" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="520" y="216" width="408" height="120" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="724" y="248" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">P4 · NEW</text>
      <text x="724" y="276" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">4 구성 보드 · 적용</text>
      <text x="724" y="304" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">한 창 입력 · 검토 · 적용 · 시작</text>

      <rect x="520" y="24" width="200" height="120" rx="8" fill="#ececec"/>
      <text x="620" y="52" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">P5 · PART</text>
      <text x="620" y="80" text-anchor="middle" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">5 로그 · 스니프</text>
      <text x="620" y="108" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">기존 ○ · getmenu 이후</text>

      <rect x="760" y="24" width="200" height="120" rx="8" fill="#ececec"/>
      <text x="860" y="52" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">P6 · LATER</text>
      <text x="860" y="80" text-anchor="middle" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">6 배포</text>
      <text x="860" y="108" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">systemd · 등록 API</text>

      <text x="40" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ORDER</text>
      <text x="40" y="432" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', sans-serif">구현은 3 다음에 4. 4의 적용이 끝나야 MVP가 닫힌다. 1·2·5 기존 화면은 회귀만 본다.</text>
    </svg>
  </div>
</body>
</html>
