<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>책임 계층</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>프론트는 JSON, 백엔드는 파일과 프로세스</h1>
    <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-layers-title stack-layers-desc">
      <title id="stack-layers-title">책임 계층</title>
      <desc id="stack-layers-desc">프론트엔드, FastAPI 백엔드, Earthworm 런타임 세 계층. 백엔드가 파일과 CLI 를 소유한다.</desc>
      
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      
      <text x="48" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">JSON / WS</text>
      <line x1="64" y1="68" x2="64" y2="292" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <polygon points="60,292 68,292 64,304" fill="#4f5d75"/>
      <text x="48" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SHM / CLI</text>

      <line x1="112" y1="64" x2="960" y2="64" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="112" y1="256" x2="960" y2="256" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <rect x="112" y="64" width="848" height="64" fill="#ffffff"/>
      <line x1="112" y1="128" x2="960" y2="128" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="132" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="248" y="104" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">프론트엔드</text>
      <text x="940" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">pages · forms · tables</text>

      <rect x="112" y="128" width="848" height="64" fill="rgba(235,108,54,0.08)"/>
      <rect x="112" y="128" width="848" height="64" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="132" y="164" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L1</text>
      <text x="248" y="168" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">백엔드</text>
      <text x="940" y="168" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">REST · WS · parser · CLI · sweep</text>

      <rect x="112" y="192" width="848" height="64" fill="#ececec"/>
      <text x="132" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L0</text>
      <text x="248" y="232" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">Earthworm 런타임</text>
      <text x="940" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">ew_linux.bash · startstop · rings</text>

      <text x="112" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
      <text x="248" y="292" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif">프론트는 JSON/WS 만. 파일과 프로세스는 백엔드만 다룬다.</text>

    </svg>
  </div>
</body>
</html>
