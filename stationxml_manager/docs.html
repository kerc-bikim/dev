    const EMBEDDED_DOCS = {
  "README.md": "# StationXML 메타데이터 관리\n\n엑셀 또는 StationXML을 올려 네트워크·관측소·채널 메타데이터를 고치고, 다시 StationXML·엑셀로 내보내는 로컬 웹 도구입니다. 센서와 기록계는 장비 카탈로그 ID만 고를 수 있습니다.\n\n가독성 있는 HTML 문서는 [`docs.html`](docs.html)에서 이 파일과 [`PLAN.md`](PLAN.md), [`DATALESS_SEED.md`](DATALESS_SEED.md), [`RESPONSE_CHART.md`](RESPONSE_CHART.md), [`CUSTOM_EQUIPMENT.md`](CUSTOM_EQUIPMENT.md)를 불러와 봅니다.\n\n- 상태: v1 구현 완료 (코드 리뷰 반영 포함)\n- 스택: FastAPI + ObsPy + SQLite (`app/`), React + Vite + TypeScript (`frontend/`)\n- UI: 한국어\n\n---\n\n## 구성\n\n```\nstationxml_manager/\n├── app/                      FastAPI · ObsPy · SQLite\n│   ├── main.py               HTTP API, 접근 제어, 업로드 제한\n│   ├── cli.py                템플릿·가져오기·내보내기 CLI\n│   ├── models.py             Network / Station / Channel / Catalog / Audit\n│   ├── crud.py               upsert, NRL, 응답(Response) 보존\n│   ├── excel_io.py           엑셀 읽기/쓰기, 빈 템플릿\n│   ├── xml_io.py             StationXML → 계층 구조\n│   ├── inventory.py          DB → ObsPy Inventory\n│   ├── catalog.py            시드 YAML, 제조사·모델 매칭\n│   ├── columns.py            엑셀 열 이름·수준(네트워크/관측소/채널)\n│   ├── validation.py         위경도·시간·sps 검사, 시간 정규화\n│   ├── audit.py              변경이력 JSON\n│   ├── db.py                 SQLite 세션\n│   └── errors.py             ValidationError / AppError\n├── frontend/                 React + Vite (한글 UI)\n├── tests/                    pytest (코어 + API)\n├── equipment_catalog.yaml    최초 장비 목록(이후는 DB가 원본)\n├── data/stationxml.db        SQLite (실행 후 생성)\n├── scripts/build_docs_html.py  README/PLAN을 docs.html에 내장\n├── README.md · PLAN.md · DATALESS_SEED.md · RESPONSE_CHART.md · CUSTOM_EQUIPMENT.md\n└── docs.html                 마크다운 HTML 로더\n```\n\nSQLite 파일은 `data/stationxml.db`에 저장됩니다.\n\n---\n\n## 데이터 모델\n\n엑셀 한 행은 한 채널입니다. DB는 계층 구조입니다.\n\n```mermaid\nflowchart TB\n  NET[Network\u003cbr/>code, description, operator, restricted]\n  STA[Station\u003cbr/>code, lat/lon/elev, site, vault]\n  CHA[Channel\u003cbr/>NSLC + start_time, sps, equipment IDs]\n  CAT[EquipmentCatalog\u003cbr/>sensor / datalogger]\n  AUD[AuditLog]\n  NET --> STA --> CHA\n  CAT -.->|sensor_id / datalogger_id| CHA\n  CHA -.-> AUD\n```\n\n| 수준 | 저장 위치 | 엑셀에서 |\n|------|-----------|----------|\n| 네트워크 | `networks` | 같은 네트워크 코드의 행은 설명이 일치해야 함 |\n| 관측소 | `stations` | 사이트명·좌표 등이 행마다 다르면 가져오기 실패 |\n| 채널 | `channels` | 한 행 = 한 채널. 고유키는 관측소 + 위치코드 + 채널 + 시작시간 |\n| 장비 | `equipment_catalog` | `catalog_sensors` / `catalog_dataloggers` 시트 또는 웹 카탈로그 탭 |\n| 이력 | `audit_log` | 웹 변경이력 탭 (복원 기능 없음) |\n\n채널의 계측기 응답은 `response_xml` blob으로 보관합니다. 출처는 `response_source` (`none` / `imported` / `nrl`)입니다. Poles/Zeros 편집이 생기면 `edited`를 추가할 예정입니다 ([`RESPONSE_CHART.md`](RESPONSE_CHART.md)).\n\n---\n\n## 웹으로 실행\n\n```bash\ncd stationxml_manager\npython -m venv .venv\nsource .venv/bin/activate   # Windows: .venv\\Scripts\\activate\npip install -r requirements.txt\n\n# 백엔드\nuvicorn app.main:app --reload --host 127.0.0.1 --port 8000\n\n# 프론트엔드 (다른 터미널)\ncd frontend\nnpm install\nnpm run dev\n```\n\n브라우저에서 `http://localhost:5173`을 엽니다. Vite가 `/api`를 `8000`으로 프록시합니다. API 문서: `http://localhost:8000/docs`.\n\n프론트를 빌드해 백엔드와 같이 쓰려면:\n\n```bash\ncd frontend && npm install && npm run build\ncd ..\nuvicorn app.main:app --host 127.0.0.1 --port 8000\n```\n\n### 문서 HTML 로더\n\n`docs.html`은 `README.md`와 `PLAN.md`를 읽어 목차·표·Mermaid 다이어그램으로 보여 줍니다.\n\n```bash\ncd stationxml_manager\npython -m http.server 8080\n# http://localhost:8080/docs.html\n```\n\n마크다운을 고친 뒤 내장 사본을 갱신하려면:\n\n```bash\npython scripts/build_docs_html.py\n```\n\n`file://`로 바로 열면 최신 `.md`를 fetch하지 못할 수 있습니다. 그때는 내장 사본을 쓰거나, 로더의 **파일 열기**로 로컬 마크다운을 고릅니다.\n\n---\n\n## 접근 제어\n\n기본 API는 **로컬 요청만** 허용합니다 (`127.0.0.1`, `::1`).\n\n다른 컴퓨터에서 접속하려면 API 키와 허용 Origin을 설정하고, 웹 화면 상단에도 같은 API 키를 입력합니다. API 키를 설정하면 **로컬 접속도 키가 필요**합니다.\n\n리버스 프록시를 사용하는 경우에도 반드시 API 키를 설정해야 합니다. `X-Forwarded-For` / `Forwarded`가 붙은 요청은 키가 없으면 차단됩니다. CORS 미들웨어는 인증보다 바깥에 있어 401/403에도 브라우저가 오류 본문을 읽습니다.\n\n```bash\nexport STATIONXML_API_KEY=\"충분히-긴-임의의-값\"\nexport STATIONXML_CORS_ORIGINS=\"http://192.168.0.10:5173\"\nuvicorn app.main:app --host 0.0.0.0 --port 8000\n```\n\n| 환경 변수 | 기본 | 설명 |\n|-----------|------|------|\n| `STATIONXML_API_KEY` | (없음) | 있으면 모든 `/api`에 `X-API-Key` 필요 |\n| `STATIONXML_CORS_ORIGINS` | `http://localhost:5173,http://127.0.0.1:5173` | 허용 Origin 목록 |\n| `STATIONXML_MAX_UPLOAD_MB` | `20` | 가져오기 파일 크기. 잘못된 값은 기본값으로 되돌림 |\n\n프론트 상단 **API 키** 칸은 입력 즉시 `localStorage`에 저장되고, 내보내기 다운로드에도 같은 헤더를 붙입니다.\n\n---\n\n## CLI\n\n```bash\n# 드롭다운이 있는 엑셀 템플릿 (채널 행 없음, 카탈로그 시트만)\npython -m app.cli --write-template stations.xlsx\n\n# 엑셀 또는 StationXML → DB 적재 후 StationXML 저장\npython -m app.cli stations.xlsx -o inventory.xml\npython -m app.cli inventory.xml -o inventory.xml --replace-all\n\n# 카탈로그 NRL 키로 응답을 붙인 뒤 저장\npython -m app.cli inventory.xml -o inventory.xml --apply-nrl\n```\n\nNRL 응답은 내보내기 때 자동으로 붙지 않습니다. 웹의 **NRL** 버튼 또는 `--apply-nrl`일 때만 적용합니다.\n\n`--replace-all`은 네트워크·관측소·채널을 지운 뒤 다시 넣습니다. 같은 NSLC+시작시간에 있던 `response_xml`은 새 파일에 응답이 없어도 유지합니다. 채널이 하나도 없는 파일은 거절하며 기존 자료는 바꾸지 않습니다.\n\n---\n\n## 웹 UI\n\n| 탭 | 역할 |\n|----|------|\n| 채널 | 필터, 추가/수정/삭제, 센서·기록계 드롭다운, NRL 적용 |\n| 관측소 | 좌표·사이트 정보. 네트워크 이동 가능(중복 코드 검사) |\n| 네트워크 | 설명·운영기관·공개제한 |\n| 장비 카탈로그 | 센서/기록계 CRUD. 사용 중인 ID는 삭제 불가 |\n| 가져오기/내보내기 | xlsx·xml 업로드, StationXML/엑셀/템플릿 다운로드 |\n| 변경이력 | 감사 로그 조회. 복원 없음 |\n\n작업자 이름은 이력에만 남습니다. 로그인 계정은 없습니다.\n\n전체 교체 가져오기는 확인 대화상자와 `confirm_replace` 폼 값이 있어야 실행됩니다.\n\n---\n\n## 엑셀 사용\n\n한 행 = 한 채널입니다. 같은 관측소의 사이트명·좌표 등이 행마다 다르면 가져오기가 실패합니다.\n\n**필수 열:** 네트워크, 관측소, 채널, 위도, 경도, 시작시간, 샘플링레이트\n\n센서ID·기록계ID는 `catalog_sensors` / `catalog_dataloggers` 시트 값만 쓸 수 있습니다. 알 수 없는 열 이름은 거절됩니다. `extra` 키-값 열은 없습니다.\n\n### 시트\n\n| 시트 | 내용 |\n|------|------|\n| `channels` | 채널 행 (한글 헤더 또는 영문 별칭) |\n| `catalog_sensors` | 센서 카탈로그 |\n| `catalog_dataloggers` | 기록계 카탈로그 (sps 포함) |\n\n웹 **템플릿 받기**와 CLI `--write-template`는 카탈로그 시트와 헤더만 넣고 **채널 행은 비웁니다**. 현재 DB 인벤토리를 엑셀로 받으려면 **엑셀 내보내기**를 씁니다.\n\n### 열 이름 (한글 헤더 / 영문)\n\n네트워크: 네트워크, 네트워크설명, 운영기관, 공개제한\n\n관측소: 관측소, 위도, 경도, 고도, 관측소명, 위치설명, 시군구, 지역, 국가, 설치환경, 지질, 관측소설명, 설치일, 철거일\n\n채널: 채널, 시작시간, 샘플링레이트, 위치코드, 심도, 끝시간, 방위각, 경사, 채널설명, 비고, 채널유형, 시각오차, 채널위도, 채널경도, 채널고도, 센서ID, 센서일련번호, 센서유형, 센서설치일, 센서철거일, 기록계ID, 기록계일련번호, 기록계유형, 기록계설치일, 기록계철거일\n\n방위각·경사를 비우면 채널 코드 마지막 글자(`Z`/`N`/`E`/`1`/`2`)로 추정합니다. 심도 `0`은 유효한 값입니다.\n\n### 엑셀 왕복 한계\n\n계측기 응답(Response)은 StationXML에만 있습니다. 엑셀은 표 메타데이터용입니다.\n\n- StationXML을 올린 뒤 엑셀을 다시 가져와도, 같은 NSLC+시작시간의 기존 응답은 유지됩니다.\n- 전체 교체(`replace_all`)도 매칭되는 채널의 응답 blob을 보존합니다.\n- 엑셀만으로 NRL 응답을 실을 수는 없습니다. 웹 **NRL** 또는 CLI `--apply-nrl`을 씁니다.\n\n---\n\n## 가져오기 · 내보내기 · NRL\n\n```mermaid\nflowchart LR\n  XLSX[엑셀] --> IMP[import_hierarchy]\n  XML[StationXML] --> IMP\n  IMP --> DB[(SQLite)]\n  DB --> OUTXML[StationXML 내보내기]\n  DB --> OUTXLS[엑셀 내보내기]\n  CAT[카탈로그 nrl_keys] -.->|명시적 NRL만| DB\n```\n\n- **upsert:** 같은 네트워크/관측소/NSLC+시작시간이 있으면 수정, 없으면 추가.\n- **시간 정규화:** `canonical_time()`으로 UTC 문자열을 맞춰, `...00`과 `...000000Z`가 다른 행으로 들어가지 않습니다.\n- **응답:** 들어오는 파일에 Response가 있으면 덮어쓰고, 없으면 기존 blob을 유지합니다.\n- **빈 가져오기:** 채널 0건이면 400으로 거절하고 DB를 비우지 않습니다.\n- **NRL:** 채널마다 카탈로그 `nrl_keys`로 ObsPy NRL을 붙입니다. 키가 없거나 매칭 실패면 오류입니다. 내보내기 때 자동 적용하지 않습니다.\n\n---\n\n## 값 검사\n\n- 위도 -90~90, 경도 -180~180\n- 시작시간 \u003c 끝시간\n- 고도 0이면 경고(저장은 허용)\n- 기록계 카탈로그 sps와 채널 샘플링레이트 일치 (제조사·모델만 같고 sps가 다르면 매칭 실패)\n- 채널이 쓰는 장비 ID는 카탈로그에서 삭제 불가\n- 사용 중인 기록계의 샘플링레이트를 비울 수 없음\n- 카탈로그 upsert 때 `nrl_keys` / `sample_rate`는 값이 있을 때만 덮어씀\n- 파싱 오류는 400 한글 메시지, 고유키 충돌은 409\n\n---\n\n## HTTP API\n\n인증: 로컬이거나 `X-API-Key`. 업로드는 `STATIONXML_MAX_UPLOAD_MB` 제한.\n\n| 방법 | 경로 | 설명 |\n|------|------|------|\n| GET | `/api/health` | 상태 |\n| GET/PUT | `/api/networks`, `/api/networks/{id}` | 네트워크 |\n| GET/POST/PUT/DELETE | `/api/stations`, `/api/stations/{id}` | 관측소. PUT으로 `network_id` 이동 가능 |\n| GET/POST/PUT/DELETE | `/api/channels`, `/api/channels/{id}` | 채널 |\n| POST | `/api/channels/{id}/apply-nrl` | NRL 응답 적용 |\n| GET/POST/PUT/DELETE | `/api/catalog`, `/api/catalog/{id}` | 장비 카탈로그 |\n| POST | `/api/import` | `file` + `replace_all` + `confirm_replace` + `actor` |\n| GET | `/api/export/stationxml` | StationXML 다운로드 |\n| GET | `/api/export/xlsx` | 엑셀 다운로드 (채널 포함) |\n| GET | `/api/template.xlsx` | 빈 템플릿 (카탈로그만) |\n| GET | `/api/history` | 변경이력 (`limit`, `nslc`) |\n\n---\n\n## 테스트\n\n```bash\ncd stationxml_manager\nPYTHONPATH=. pytest -q\n```\n\nObsPy 1.4.1은 SQLAlchemy 1.4가 필요합니다 (`requirements.txt`의 `sqlalchemy==1.4.54`).\n\n---\n\n## 계획과 범위\n\n확정 결정, 구현 체크리스트, 코드 리뷰 반영은 [`PLAN.md`](PLAN.md)를 봅니다. dataless SEED는 [`DATALESS_SEED.md`](DATALESS_SEED.md), 응답 곡선은 [`RESPONSE_CHART.md`](RESPONSE_CHART.md), NRL에 없는 장비는 [`CUSTOM_EQUIPMENT.md`](CUSTOM_EQUIPMENT.md)에 계획이 있습니다.\n",
  "PLAN.md": "# StationXML 메타데이터 관리 — 계획과 구현\n\n엑셀·StationXML을 읽고 고친 뒤 다시 내보내는 로컬 웹 관리기의 **확정 계획**과 **구현 결과**입니다.\n\n- 상태 표기: [x] 구현 완료\n- 스택: FastAPI + ObsPy + SQLite (`app/`), React + Vite + TypeScript (`frontend/`)\n- 사용법·API·엑셀 열: [`README.md`](README.md)\n- HTML 보기: [`docs.html`](docs.html)\n- 다음 작업(결정 확정): [`DATALESS_SEED.md`](DATALESS_SEED.md) — dataless SEED 가져오기·내보내기\n- 다음 작업(제안): [`RESPONSE_CHART.md`](RESPONSE_CHART.md) — 응답 곡선·겹치기·PZ 편집·PNG\n- 다음 작업(제안): [`CUSTOM_EQUIPMENT.md`](CUSTOM_EQUIPMENT.md) — NRL에 없는 장비 사용자 정의 메타데이터\n\n실제 백엔드 경로는 `backend/`이 아니라 `app/`입니다. CLI는 `python -m app.cli`입니다.\n\n---\n\n## 목표\n\n1. 엑셀(한 행 = 한 채널)과 StationXML을 같은 DB 계층(Network → Station → Channel)으로 가져온다.\n2. 웹에서 네트워크·관측소·채널·장비 카탈로그를 CRUD한다.\n3. StationXML / 엑셀로 내보낸다. 계측기 Response는 StationXML blob으로 보존한다.\n4. 센서·기록계는 자유 입력이 아니라 카탈로그 ID만 허용한다.\n5. 변경이력을 남긴다. 복원·로그인 계정은 v1 밖이다.\n\n---\n\n## 확정 결정\n\n| # | 결정 | 이유 |\n|---|------|------|\n| 1 | 가져온 StationXML Response는 `response_xml` blob으로 보관. NRL은 선택 | 엑셀에 응답이 없어도 StationXML 왕복이 깨지지 않게 |\n| 2 | 네트워크·관측소 필드는 부모 수준에 저장·편집 | 엑셀 행마다 좌표가 갈리면 거절 |\n| 3 | 카탈로그는 웹 + 엑셀 카탈로그 시트로 편집 | YAML은 최초 시드만. 이후 원본은 DB |\n| 4 | `extra` 키-값 없음. 알 수 없는 엑셀 열은 거절 | 스키마를 고정해 왕복을 예측 가능하게 |\n| 5 | 내보내기 때 NRL 자동 부착 없음 | 명시적 **NRL** / `--apply-nrl`만 |\n\n나중에 고정한 동작:\n\n- 엑셀 재가져오기가 기존 응답을 지우지 않음 (전체 교체 포함, NSLC+시작시간 매칭)\n- 사용 중인 카탈로그 항목은 삭제 불가\n- 엑셀 왕복 한계를 UI·문서에 명시\n- UI는 한국어\n- 위경도·시간 순서·기록계 sps 검사\n\n---\n\n## 아키텍처\n\n```mermaid\nflowchart LR\n  User[브라우저]\n  FE[\"React + Vite (한글 UI)\"]\n  BE[FastAPI app/]\n  DB[(\"SQLite data/stationxml.db\")]\n  NRL[ObsPy NRL]\n  User -->|탭 CRUD / 가져오기| FE\n  FE -->|\"/api/* + X-API-Key\"| BE\n  BE --> DB\n  BE -.->|apply-nrl 명시 시에만| NRL\n  BE -->|StationXML / xlsx| User\n```\n\n```mermaid\nflowchart TB\n  subgraph ingest [가져오기]\n    XLSX[xlsx] --> excel_io\n    XML[StationXML] --> xml_io\n    excel_io --> hier[hierarchy dict]\n    xml_io --> hier\n    hier --> import_h[import_hierarchy]\n  end\n  subgraph store [저장]\n    import_h --> NET[networks]\n    import_h --> STA[stations]\n    import_h --> CHA[channels + response_xml]\n    import_h --> CAT[equipment_catalog]\n    import_h --> AUD[audit_log]\n  end\n  subgraph out [내보내기]\n    CHA --> inventory[ObsPy Inventory]\n    inventory --> OUTXML[inventory.xml]\n    NET --> OUTXLS[inventory.xlsx]\n    STA --> OUTXLS\n    CHA --> OUTXLS\n    CAT --> OUTXLS\n  end\n```\n\n---\n\n## 구현 범위\n\n### 백엔드 (`app/`)\n\n- [x] SQLite + SQLAlchemy 1.4 classic `declarative_base` (ObsPy 1.4.1 호환)\n- [x] Network / Station / Channel / EquipmentCatalog / AuditLog\n- [x] 엑셀 읽기: 한글·영문 별칭, 필수 열, 알 수 없는 열 거절\n- [x] 엑셀 쓰기: 채널 + 카탈로그 시트, 드롭다운 템플릿\n- [x] 빈 템플릿: `write_excel(..., include_channels=False)` — 현재 인벤토리를 넣지 않음\n- [x] StationXML 읽기: Response → `response_xml`, 장비는 카탈로그 ID로 매칭\n- [x] StationXML 쓰기: blob을 Channel.response에 복원\n- [x] upsert + `canonical_time()`으로 시작시간 중복 방지\n- [x] `replace_all` 시 매칭 채널의 응답 보존, 빈 파일 거절\n- [x] 카탈로그 시드 YAML, 웹 CRUD, 사용 중 삭제 차단\n- [x] 제조사·모델 매칭 시 sps가 다르면 다른 기록계로 보지 않음\n- [x] NRL은 채널 단위 명시 적용만\n- [x] 위경도, 시간 순서, sps, 심도 0 허용\n- [x] 로컬 전용 API, `STATIONXML_API_KEY`, 프록시 차단, CORS, 업로드 용량\n- [x] 파싱 오류 400 한글, IntegrityError 409\n- [x] CLI `python -m app.cli`\n\n### 프론트엔드 (`frontend/`)\n\n- [x] 채널 / 관측소 / 네트워크 / 카탈로그 / 가져오기·내보내기 / 변경이력 탭\n- [x] 센서·기록계 드롭다운 (카탈로그 ID만)\n- [x] API 키 입력, `localStorage` 즉시 동기화, 다운로드에도 헤더\n- [x] 전체 교체 확인, 삭제·필터 오류 처리, 이력 JSON 파싱 보호\n- [x] 관측소 `network_id` 변경 UI\n\n### 테스트 (`tests/`)\n\n- [x] 코어: 엑셀 왕복, 응답 보존, 시간 정규화, 카탈로그, 검증\n- [x] API: 접근 제어, 업로드 제한, `confirm_replace`, 템플릿, 관측소 이동\n\n---\n\n## 코드 리뷰 반영\n\n리뷰에서 나온 동작 오류·보안·UX를 반영한 내용입니다.\n\n| 이슈 | 반영 |\n|------|------|\n| `depth=0` PUT이 `0 or None`으로 NOT NULL 500 | 0을 유지하는 갱신 |\n| `replace_all`이 `response_xml`을 지움 | NSLC+시작시간으로 blob 보존. 빈 import 거절. UI 확인 + `confirm_replace` |\n| 시작시간 문자열 불일치로 중복 행 | `canonical_time()` 후 비교·저장 |\n| 카탈로그 제조사·모델이 다른 sps로 떨어짐 | sps가 다르면 매칭 실패 |\n| 카탈로그 upsert가 `nrl_keys`/`sample_rate`를 None으로 지움 | 값이 있을 때만 덮어씀. 사용 중 기록계 sps 비우기 금지 |\n| `/api/template.xlsx`가 전체 인벤토리를 넣음 | 채널 없는 템플릿 |\n| 관측소 `network_id` 변경이 무시됨 | 중복 검사 후 갱신 |\n| 인증 없는 API + CORS `*` | 로컬만 허용. 키 설정 시 전체 요구. CORS Origin 제한. 프록시 키 필수 |\n| CORS가 인증보다 안쪽 | 401/403에도 CORS 헤더 |\n| 업로드 크기 제한 없음 | `STATIONXML_MAX_UPLOAD_MB` (기본 20, 잘못된 env는 기본값) |\n| 파싱 예외가 500 | 400 한글. 고유키 409 |\n| 프론트 다운로드·삭제·필터 레이스 | fetch+헤더, 오류 표시, request-id로 필터 레이스 방지 |\n\n---\n\n## v1에 넣지 않은 것\n\n- `extra` 키-값, 알 수 없는 엑셀 열을 extra로 흡수\n- 내보내기 시 NRL 자동 부착\n- 변경이력에서 복원\n- 로그인 계정·권한 모델\n- 다중 사용자 동시 편집 잠금\n- FDSN 원격 조회\n- dataless SEED (계획만: [`DATALESS_SEED.md`](DATALESS_SEED.md))\n- NRL에 없는 장비 입력 UX (계획만: [`CUSTOM_EQUIPMENT.md`](CUSTOM_EQUIPMENT.md))\n\n---\n\n## v1.1 — dataless SEED (결정 확정)\n\nSEED Manual V2.4의 dataless 볼륨(Volume + Abbreviation + Station Control, 파형 없음)을 엑셀·StationXML과 같은 입구로 넣는다.\n\n- 상태: [ ] 결정 확정, 구현 대기\n- 내부 원본은 그대로 DB + `response_xml`. ObsPy `Inventory.write/read format=\"SEED\"`가 변환 허브\n- **S4** full SEED → 메타만 적재 + 파형 무시 경고. MiniSEED 전용은 거절\n- **S11** 응답 없는 채널이 하나라도 있으면 dataless 내보내기 전체 실패 (400, 파일 없음)\n- **S12** 실패 시 채널(NSLC)마다 원인을 서버 로그·API·화면·CLI에 남김\n- **S13** 웹에 StationXML / Dataless SEED 형식 선택. 지금은 버튼이 StationXML·엑셀뿐이라 선택 옵션 없음\n- 한글 사이트명은 ASCII 제약. 상세: [`DATALESS_SEED.md`](DATALESS_SEED.md)\n\n---\n\n## v1.2 제안 — 채널 응답 곡선\n\n채널 탭에서 관측소·채널을 고르면 `response_xml`을 진폭·위상 차트로 보여 준다.\n\n- 상태: [ ] 제안. 백엔드 JSON + 프론트 D3 (서버 matplotlib PNG 아님)\n- 구현 순서: 단곡선 → 겹치기(최대 8, 부분 성공) → PNG(화면 SVG 래스터) → Poles/Zeros 편집\n- 겹치기: `GET /api/response-curves` 공통 주파수 격자. S11 전체 실패와 다름\n- PZ: `PolesZeros` 단계만. 저장 시 A0 재계산·evalresp 검증·실패 시 롤백. `response_source=edited`\n- PNG: PPSD `exportPng`와 같이 클라이언트만. 단채널·비교 파일명 규칙\n- 상세: [`RESPONSE_CHART.md`](RESPONSE_CHART.md)\n- 겹치기 상한 등 열린 선택: [`CUSTOM_EQUIPMENT.md`](CUSTOM_EQUIPMENT.md) Q8\n\n---\n\n## v1.3 제안 — NRL에 없는 장비\n\nNRL 사전에 없는 센서·기록계를 카탈로그 `origin=custom`으로 넣고, 채널은 계속 ID만 가리킨다.\n\n- 상태: [ ] 제안. 답이 오기 전 기본값: 메타데이터만 (응답 생성은 Q2), StationXML 미매칭은 custom 승격\n- 채널 모달 **목록에 없음**, 엑셀 채널 시트에는 제조사·모델 열을 열지 않음\n- 선택이 필요한 항목(Q1–Q9)은 문서에 다지선다로 적어 둠\n- 상세: [`CUSTOM_EQUIPMENT.md`](CUSTOM_EQUIPMENT.md)\n\n---\n\n## 파일 역할\n\n| 경로 | 역할 |\n|------|------|\n| `app/main.py` | FastAPI, 접근 제어, import/export 엔드포인트 |\n| `app/crud.py` | 계층 upsert, 응답 보존, NRL, 카탈로그 가드 |\n| `app/excel_io.py` | 엑셀 I/O, 템플릿 |\n| `app/xml_io.py` | StationXML → hierarchy |\n| `app/inventory.py` | DB → ObsPy Inventory / Response blob |\n| `app/catalog.py` | YAML 시드, 제조사·모델·sps 매칭 |\n| `app/columns.py` | 열 별칭과 네트워크/관측소/채널 수준 |\n| `app/validation.py` | 위경도·시간·sps, `canonical_time` |\n| `app/cli.py` | 템플릿·변환·`--apply-nrl` |\n| `frontend/src/App.tsx` | 한글 탭 UI |\n| `frontend/src/api.ts` | API 키 헤더, 업로드/다운로드 |\n| `equipment_catalog.yaml` | 빈 DB일 때만 시드 |\n| `docs.html` | README/PLAN/SEED 계획 HTML 로더 |\n| `scripts/build_docs_html.py` | 마크다운을 docs.html에 내장 |\n| `DATALESS_SEED.md` | dataless SEED 구현 전 계획 |\n| `RESPONSE_CHART.md` | 응답 곡선·겹치기·PZ 편집·PNG 계획 |\n| `CUSTOM_EQUIPMENT.md` | NRL에 없는 장비 사용자 정의 계획 |\n",
  "DATALESS_SEED.md": "# Dataless SEED 가져오기·내보내기 — 구현 전 계획\n\n상태: **결정 확정** (코드 미착수). 구현 착수 가능.\n\n참조: [SEED Reference Manual V2.4](https://www.fdsn.org/pdf/SEEDManual_V2.4.pdf) (FDSN, May 2012).  \n현재 앱: 엑셀·StationXML만 지원. 내부 원본은 SQLite 계층 + `response_xml`(StationXML blob).\n\n---\n\n## 목표\n\n지진 메타데이터를 **dataless SEED**로도 넣고 빼게 한다. 파형(MiniSEED / full SEED data records)은 다루지 않는다.\n\n매뉴얼(Ch.1, p. 권장 사용): dataless SEED는 Volume · Abbreviation · Station Control Header만 포함하고, Time Span Header와 data record는 생략한다. 메타데이터가 파형보다 자주 바뀌므로 따로 배포하기 위한 형식이다.\n\n성공 기준:\n\n1. `.seed` / `.dataless` / `.dlsv` 파일을 올리면 기존과 같은 Network → Station → Channel 행이 생긴다.\n2. 채널 Response가 있으면 지금처럼 `response_xml` blob으로 남는다.\n3. 웹·CLI에서 dataless SEED를 내려받을 수 있다.\n4. StationXML ↔ DB ↔ dataless SEED 왕복에서 NSLC·좌표·sps·응답 단계(poles/zeros, gain)가 유지된다. **바이트 단위 동일 SEED 파일은 보장하지 않는다.**\n\n---\n\n## 왜 블록ette를 직접 짜지 않는가\n\nSEED는 고정 폭 ASCII 블록ette(10, 11, 30–34, 50–62 등)의 논리 레코드(권장 4096바이트)다. 직접 직렬화하면 약어 사전 교차참조·레코드 패딩·업데이트 플래그를 모두 재구현해야 한다.\n\nObsPy 1.4.1 `Inventory`가 이미 이 변환을 한다.\n\n- 읽기: `read_inventory(..., format=\"SEED\")`\n- 쓰기: `inv.write(..., format=\"SEED\")` → dataless (파형 없음)\n\n앱은 **Inventory를 허브**로 두고, 기존 `xml_io` 매핑을 StationXML 전용이 아니라 Inventory 전용으로 끌어올린다.\n\n```mermaid\nflowchart LR\n  SEED[dataless SEED] --> RI[read_inventory SEED]\n  XML[StationXML] --> RX[read_inventory STATIONXML]\n  RI --> INV[ObsPy Inventory]\n  RX --> INV\n  INV --> HIER[hierarchy dict]\n  HIER --> DB[(SQLite)]\n  DB --> BUILD[build_inventory]\n  BUILD --> INV2[ObsPy Inventory]\n  INV2 --> WX[write STATIONXML]\n  INV2 --> WS[write SEED]\n  INV2 --> EX[엑셀]\n```\n\n블록ette를 손으로 쓰거나 원본 SEED를 DB에 보관하지 않는다.\n\n```mermaid\nflowchart TB\n  file[올린 SEED 파일] --> kind{헤더 종류}\n  kind -->|MiniSEED만| reject[400 거절]\n  kind -->|dataless| meta[채널·응답만 적재]\n  kind -->|full SEED| meta\n  kind -->|full SEED| warn[경고: 파형 무시]\n  meta --> db[(SQLite)]\n  db --> pick{형식 선택}\n  pick -->|StationXML| xml[inventory.xml]\n  pick -->|Dataless SEED| has{모든 채널에 response_xml?}\n  has -->|아니오| fail[400 + 채널별 로그]\n  has -->|예| out[inventory.dataless]\n```\n\n---\n\n## 확정 결정\n\n2026-08-17 사용자 확인: **S4 메타만+경고**, **S11 응답 없는 채널이면 내보내기 전체 실패**.\n\n| # | 결정 | 이유 |\n|---|------|------|\n| S1 | 내부 원본은 계속 계층 DB + StationXML `response_xml` | v1 왕복·NRL·엑셀 재import 보존 로직을 그대로 씀 |\n| S2 | ObsPy `format=\"SEED\"`만 사용. 커스텀 블록ette writer 없음 | 매뉴얼 준수는 ObsPy xseed가 담당 |\n| S3 | 저장·배포 대상은 dataless만. 파형 레코드는 DB에 넣지 않음 | 이 앱은 메타데이터 관리기 |\n| S4 | full SEED(헤더+파형)는 **메타데이터만** 가져오고 경고 | 현장 배포본에 파형이 붙어 있어도 메타는 살린다 |\n| S5 | MiniSEED만 있는 파일(블록ette 50/52 없음)은 거절 | 가져올 채널이 없음. 빈 import 가드와 동일 |\n| S6 | SEED 필드는 ASCII. 한글 사이트명 등은 내보내기 때 ASCII로 줄이거나 관측소 코드로 대체하고 경고 | 매뉴얼: 제어 헤더는 ANSI ASCII, 대문자 권장 |\n| S7 | 네트워크 코드 2자, 관측소 5자, 채널 3자, 위치코드 2자를 내보내기 전 검사 | B50 F16 / B50 F3 / B52 F4 / B52 F3 길이 |\n| S8 | 장비는 B33 Generic Abbreviation(계측기 이름) → 카탈로그 제조사·모델 매칭 | SEED에는 StationXML Equipment 객체가 없음 |\n| S9 | 응답 왕복은 StationXML blob 경유. SEED 약어 사전(B41–48, B60) 재현은 ObsPy에 맡김 | 바이트 동일성 불필요 |\n| S10 | NRL 자동 부착 없음 (v1과 동일) | 명시적 NRL만 |\n| S11 | 응답(`response_xml`)이 없는 채널이 **하나라도** 있으면 dataless 내보내기 **전체 실패** (400). 부분 파일은 만들지 않음 | 불완전한 SEED가 조용히 나가지 않게 |\n| S12 | 내보내기 실패는 **채널(NSLC)마다 원인**을 서버 로그·API 본문·화면·CLI에 남긴다 | 어느 채널이 왜 막혔는지 바로 확인 |\n| S13 | 웹 내보내기에 **형식 선택**(StationXML / Dataless SEED)을 둔다. 지금은 선택지가 없음 | 한 화면에서 목적 형식을 고른 뒤 받는다 |\n\n### S4 — 가져오기: 메타만 + 경고\n\n- 파일에 Volume/Station Control과 data record가 같이 있어도 채널·응답만 적재한다.\n- 경고 예: `파형 레코드는 무시하고 메타데이터만 가져왔습니다`.\n- 파형은 디스크·DB에 남기지 않는다.\n- Time Span Header(B70–74)도 저장하지 않는다.\n- 스테이션 헤더가 없는 MiniSEED는 S5로 거절한다 (경고가 아니라 400).\n\n### S11 — 내보내기: 전체 실패\n\n- `GET /api/export/dataless`와 CLI SEED 출력 전에 모든 채널의 `response_xml`을 검사한다.\n- 비어 있는 채널이 있으면 파일을 쓰지 않고 400. 메시지에 NSLC 목록을 넣는다.\n  예: `Dataless SEED를 만들 수 없습니다. 응답이 없는 채널: KG.SEO.--.HHZ, KG.BUS.--.HHN`\n- 웹은 기존 오류 배너로 보여 준다. 잘린 `.dataless`를 내려주지 않는다.\n- 해결: 해당 채널에 NRL을 적용하거나, StationXML에서 응답이 있는 상태로 다시 가져온다.\n- 실패 채널은 S12로 한 줄씩 로그한다.\n\n### S12 — 내보내기 실패 로그 (채널 단위)\n\n지금은 서버에 전용 export 로거가 없고, 웹은 빨간 배너 한 줄만 보여 준다. dataless(그리고 StationXML writer 실패)는 아래처럼 남긴다.\n\n**검사 항목과 로그 문구**\n\n| 원인 | 로그/화면 문구 예 |\n|------|-------------------|\n| `response_xml` 없음 | `KG.SEO.--.HHZ: 계측기 응답이 없습니다` |\n| 네트워크 코드 길이 | `KGX: 네트워크 코드는 2자여야 합니다` |\n| 관측소/채널/위치 코드 길이 | `KG.SEOUL.--.HHZ: 관측소 코드는 5자 이하여야 합니다` |\n| `response_xml` 파싱 실패 | `KG.SEO.--.HHZ: 저장된 응답 XML을 읽지 못했습니다: …` |\n| ObsPy SEED writer 예외 | `KG.SEO.--.HHZ: SEED 응답 단계를 쓰지 못했습니다: …` |\n\n**어디에 남기는가**\n\n- 서버: `logging.getLogger(\"stationxml_manager.export\")` ERROR. 한 채널 한 줄. `response_xml` 본문은 넣지 않는다.\n- API 400 JSON:\n  ```json\n  {\n    \"detail\": \"Dataless SEED를 만들 수 없습니다. 문제 채널 2개\",\n    \"errors\": [\n      {\"nslc\": \"KG.SEO.--.HHZ\", \"reason\": \"계측기 응답이 없습니다\"},\n      {\"nslc\": \"KG.BUS.--.HHN\", \"reason\": \"계측기 응답이 없습니다\"}\n    ]\n  }\n  ```\n- 웹: 배너 + 채널별 목록. 다운로드는 시작하지 않음.\n- CLI: 같은 줄을 stderr에 찍고 종료 코드 ≠ 0.\n\nS11과 같이 **파일을 만들지 않은 뒤에** 로그를 남긴다. 성공한 내보내기는 INFO 한 줄(`dataless 36 channels`).\n\n### S13 — 지금 선택 옵션이 있는가 / 어떻게 둘 것인가\n\n**지금(v1):** 없다. 가져오기/내보내기 탭은 버튼이 나뉘어 있다.\n\n- StationXML 다운로드 → `/api/export/stationxml`\n- 엑셀 다운로드 → `/api/export/xlsx`\n- 엑셀 템플릿\n- Dataless SEED 버튼·형식 콤보는 **아직 없음**\n\n**계획:** 메타데이터 볼륨은 라디오로 고른 뒤 한 번 받는다.\n\n- 형식: `StationXML` / `Dataless SEED` (기본 StationXML)\n- 버튼: **다운로드** → 고른 형식의 API를 호출\n- 엑셀·템플릿은 표 왕복용이므로 옆에 그대로 둔다\n- CLI는 출력 확장자로 고른다: `-o inventory.xml` / `-o inventory.seed`\n- API는 경로를 유지한다 (`/api/export/stationxml`, `/api/export/dataless`). 콤보는 UI만의 선택이다.\n\nStationXML 내보내기는 응답이 없어도 지금처럼 허용한다. S11·S12의 “전체 실패 + 채널 로그”는 **Dataless SEED를 골랐을 때**만 적용한다.\n\n---\n\n## 매뉴얼 필드 ↔ 우리 모델\n\n### Volume / Abbreviation (읽기만, 저장 안 함)\n\n| SEED | 역할 | 앱 |\n|------|------|-----|\n| B10 Volume Identifier | 볼륨 시각, 논리 레코드 길이 | 무시 (ObsPy가 소비) |\n| B11 Volume Station Index | 관측소 인덱스 | 무시 |\n| B30 Data Format Dictionary | 채널이 참조 | 내보내기는 ObsPy 기본값 |\n| B33 Generic Abbreviation | 계측기 이름 | 센서/기록계 카탈로그 매칭 문자열 |\n| B34 Units Abbreviation | M/S, V 등 | Response 단계 단위. blob에 포함 |\n\n### Station Control — 저장 대상\n\n| SEED | 우리 필드 |\n|------|-----------|\n| B50 F3 Station call letters | `stations.code` |\n| B50 F4–6 lat / lon / elev | 관측소 좌표·고도 |\n| B50 F9 Site name (최대 60자 ASCII) | `site_name` (가져오기). 내보내기 때 ASCII 제약 |\n| B50 F13–14 유효 시작·끝 | `creation_date` / `termination_date` |\n| B50 F16 Network Code (2자, v2.3+) | `networks.code`. 없거나 공백이면 **거절** |\n| B51 Station Comment | `station_description` 또는 첫 댓글. 다중 댓글은 첫 건만 (엑셀과 같음) |\n| B52 F3 Location ID (2자) | `channels.location` |\n| B52 F4 Channel ID (3자) | `channels.channel` |\n| B52 F6 Instrument identifier → B33 | 센서 카탈로그 매칭. 실패 시 경고, ID 비움 |\n| B52 F7 Optional comment (≤30자) | `sensor_serial` 후보 또는 `comment` |\n| B52 F10–13 채널 lat/lon/elev/depth | 채널 좌표·심도 |\n| B52 F14–15 azimuth / dip | 방위각·경사. 없으면 채널 코드로 추정 |\n| B52 F18 Sample rate | `sample_rate` (필수) |\n| B52 F19 Max clock drift | `clock_drift` |\n| B52 F21 Channel flags | `channel_types` (C/G/T 등 → 기존 콤마 목록으로 매핑) |\n| B52 F22–23 start / end | 채널 시작·끝. 시작 없으면 거절 |\n| B53–58, 61, 62 응답 단계 | ObsPy `Channel.response` → `dump_response_xml` |\n| B60 Response Reference | ObsPy가 사전을 풀어 Response로 만듦 |\n\n기록계는 SEED에 별도 블록ette가 없다. 가져오기 때는 기록계 ID를 비우고 경고할 수 있다. 내보내기 때는 카탈로그 제조사·모델을 B33 문자열에 합친다 (`Guralp CMG-3T` 또는 `sensor + datalogger`).\n\n---\n\n## 왕복 한계 (UI에 명시할 문구)\n\n엑셀과 같은 성격의 한계다.\n\n- 한글·비ASCII 사이트명·설명·댓글은 SEED에 그대로 못 넣는다.\n- 네트워크 설명, 운영기관, `restricted_status`는 StationXML 전용에 가깝다. SEED에 없으면 내보내기에서 빠지거나 B33/B51에 우겨 넣지 않는다 (손실 허용).\n- 카탈로그 ID는 SEED에 없다. 다시 가져오면 제조사·모델 문자열이 맞을 때만 ID가 복구된다.\n- 응답은 수학적으로 같아야 하지만, 블록ette 번호·약어 사전 키·레코드 패딩은 달라질 수 있다.\n- 채널 유형 플래그(B52 F21)와 StationXML `types`의 매핑이 1:1이 아닐 수 있다.\n\n---\n\n## 구현 단계\n\n코드는 이 순서로만 넣는다. 한 단계가 테스트 통과한 뒤에 다음으로 간다.\n\n### 1. Inventory 허브 리팩터\n\n- `xml_io.read_stationxml`에서 Inventory → hierarchy 매핑을 `inventory_to_hierarchy(inv, session)`로 분리.\n- StationXML 읽기는 `read_inventory(..., format=\"STATIONXML\")` 후 그 함수 호출.\n- 기존 StationXML·엑셀 테스트가 그대로 통과해야 함.\n\n### 2. dataless 읽기\n\n- `read_seed(path_or_buf, session)`: `format=\"SEED\"`.\n- 확장자 `.seed`, `.dataless`, `.dlsv` 및 내용 스니프(논리 레코드 헤더 `V` volume).\n- MiniSEED만이면 ValidationError: 한글 메시지 (S5).\n- full SEED면 가져오기는 성공하고 경고에 “파형 레코드는 무시하고 메타데이터만 가져왔습니다” (S4).\n- 네트워크 코드 없음/길이 위반은 거절.\n- 응답은 기존 `dump_response_xml`.\n- import `source=\"seed\"`.\n\n### 3. dataless 쓰기\n\n- `inventory_to_seed_bytes(inv) -> bytes`: `inv.write(format=\"SEED\")`.\n- 내보내기 전 코드 길이·ASCII 검사. 길이 위반은 400. 한글 사이트명은 관측소 코드로 대체하고 경고 (S6–S7).\n- **S11:** 채널 중 `response_xml`이 비어 있으면 즉시 400. `inv.write`를 호출하지 않는다.\n- Response는 있으나 ObsPy writer가 단계 오류로 실패해도 마찬가지로 전체 실패 (부분 파일 없음).\n- `GET /api/export/dataless` → `inventory.dataless` (`application/vnd.fdsn.seed` 또는 `application/octet-stream`).\n\n### 4. API · CLI · UI\n\n- `POST /api/import`: 확장자·스니프에 seed 추가. 업로드 용량 제한 그대로.\n- CLI: 입력 확장자 인식, `-o inventory.seed`.\n- 가져오기 탭: `accept`에 seed 추가. **형식 라디오**(StationXML / Dataless SEED) + 다운로드 (S13).\n- 실패 시 채널별 `errors`를 배너 아래 목록으로 표시하고, 서버 로그에도 동일 문구 (S12).\n\n### 5. 테스트\n\n- ObsPy로 만든 합성 Inventory를 SEED로 쓴 뒤 import → NSLC·좌표·sps.\n- poles/zeros + sensitivity가 있는 채널: SEED → DB → StationXML → 다시 SEED → 다시 읽었을 때 단계 수·단위 유지.\n- MiniSEED 샘플 거절 (S5).\n- 합성 full SEED(헤더+더미 파형): import 성공, `warnings`에 파형 무시 문구, DB에 파형 없음 (S4).\n- 한글 `site_name` 내보내기 경고/대체.\n- 네트워크 코드 3자 내보내기 400.\n- 채널 하나라도 응답이 없으면 `/api/export/dataless`와 CLI SEED 출력이 400이고 바이트가 없음 (S11).\n- 그 400 본문에 `errors[].nslc` / `reason`이 있고, caplog에 같은 NSLC 줄이 있다 (S12).\n- StationXML 내보내기는 응답 없는 채널이 있어도 200 (S13).\n- 모든 채널에 응답이 있을 때만 SEED 파일이 나오고, 다시 읽으면 NSLC가 같다.\n- 엑셀 재import가 seed로 넣은 `response_xml`을 지우지 않음 (기존 보존 테스트 확장).\n\n### 6. 문서\n\n- README 형식 표, PLAN 체크리스트, 이 파일의 한계 절을 UI 노트와 맞춤.\n- `docs.html` 탭에 이 문서 포함.\n\n---\n\n## 손대지 않는 것 (이번 범위 밖)\n\n- MiniSEED 파형 저장·뷰어\n- RESP / SC3ML / XSEED 파일\n- 블록ette 60 사전을 DB에 별도 테이블로 보관\n- SEED 논리 레코드 길이·엔디안을 사용자가 고르게 하기 (ObsPy 기본, 보통 4096·big-endian)\n- 다중 B51/B59 댓글을 배열로 저장 (지금도 첫 댓글만)\n- FDSNWS에서 dataless를 원격으로 받기\n\n---\n\n## 위험\n\n| 위험 | 대응 |\n|------|------|\n| ObsPy SEED writer가 불완전 응답 단계에서 예외 | S11: 내보내기 전 전 채널 Response 검사. writer 예외도 한글 400, 파일 없음 |\n| 구버전 SEED(네트워크 코드 없음) | 거절 + “네트워크 코드(B50 F16)가 필요합니다” |\n| 위치코드 공백 vs `\"--\"` vs `\"\"` | 가져오기 때 `\"\"`로 정규화 (지금 StationXML과 동일) |\n| B33 문자열이 카탈로그와 다름 | 경고만, 채널은 저장 (지금 XML 장비 미매칭과 동일) |\n| 한글 ASCII 손실 | 경고 목록 + README |\n\n---\n\n## 작업량 감각\n\n침습은 중간이다. DB 스키마 변경은 없다. 핵심은 `inventory` 변환 한 곳과 import/export 입구 세 곳(API, CLI, UI)이다. 응답이 있는 합성 SEED 왕복 테스트가 공수의 상당 부분을 차지한다.\n\nS4·S11이 확정되었으므로 구현은 위 1→6 단계 순으로 시작한다.\n",
  "RESPONSE_CHART.md": "# 채널 응답 곡선 차트 — 구현 전 계획\n\n상태: **제안** (코드 미착수).\n\n웹에서 관측소·채널을 고르면 저장된 계측기 응답(`response_xml`)을 **진폭·위상 곡선**으로 보여 준다. 여러 채널을 겹치고, Poles/Zeros를 고치고, 보이는 차트를 PNG로 저장한다.\n\ndataless SEED 계획과 별개이며, 이미 DB에 있는 StationXML Response blob을 쓴다. 지금 채널 탭은 `imported` / `nrl` / `없음`만 보여 주고 곡선은 없다.\n\n---\n\n## 목표\n\n1. 네트워크 → 관측소 → 채널(시작시간 포함)을 고르면 응답 곡선을 본다.\n2. **주파수–진폭(로그)** 과 **주파수–위상** 두 패널.\n3. 체크한 여러 채널을 **같은 축에 겹친다** (범례·색).\n4. Poles/Zeros 단계 값을 표에서 고치고 저장하면 blob·곡선·이력이 갱신된다.\n5. 화면에 보이는 차트를 **PNG로 저장**한다.\n6. 응답이 없으면 안내만. `response_xml` 원문은 브라우저에 보내지 않는다.\n\n성공 기준:\n\n- 응답 있는 채널 하나: 1초 안에 곡선.\n- 최대 8채널 겹치기. 실패한 채널은 목록으로 남고 나머지는 그린다 (S11 전체 실패와 다름).\n- PZ 저장 후 곡선이 바뀌고 `response_source`가 `edited`. evalresp가 실패하면 blob은 그대로.\n- PNG에 제목·범례·두 패널이 들어가고, 화면과 같은 그림이다.\n\n---\n\n## 확정으로 제안하는 결정\n\n| # | 제안 | 이유 |\n|---|------|------|\n| R1 | 백엔드가 ObsPy로 주파수용답을 계산해 JSON을 주고, 프론트가 그린다 | PPSD_v1과 같음. 미리보기와 PNG가 같은 그림 |\n| R2 | 채널 탭 아래 패널. 행 클릭 = 주 선택, 체크박스 = 겹치기 | 이미 필터·목록이 있음. 탭을 새로 만들지 않음 |\n| R3 | 겹치기 최대 **8**채널(Q8 제안). 공통 주파수 격자. 일부 실패는 경고만 | 축이 읽히게. SEED 내보내기(S11)와 다름. 상한은 [`CUSTOM_EQUIPMENT.md`](CUSTOM_EQUIPMENT.md) Q8 |\n| R4 | 기본 출력 `VEL`. `DIS` / `ACC`는 겹친 채널 모두에 동일 적용 | 비교가 같으려면 단위가 같아야 함 |\n| R5 | 주파수: 로그 `npts` 200, `0.001 Hz` ~ 선택 채널 Nyquist의 **최솟값**(최대 100) | 한 채널만 고주파로 튀지 않게 |\n| R6 | 단일 채널 응답 없음 → 400 + 안내. 겹치기에서 일부 없음 → 그 채널만 빼고 그림 | 빈 축을 기본으로 두지 않음 |\n| R7 | 실패는 `stationxml_manager.response`에 NSLC·원인. API와 화면 동일 | 내보내기 S12와 같은 확인 방식 |\n| R8 | 차트는 `d3`. PNG는 **화면 SVG를 래스터** (서버 matplotlib PNG 아님) | 저장 그림 = 보고 있는 그림 |\n| R9 | PZ 편집은 `PolesZeros` 단계만. FIR·계수·다항식은 읽기 전용 | 잘못된 계수 편집을 막음 |\n| R10 | PZ 저장 시 확인 대화 + audit. `response_source=edited` | 응답을 바꾸면 dataless·곡선이 달라짐 |\n| R11 | 겹치기 배치는 `GET /api/response-curves` (채널 id 경로와 분리) | `/api/channels/response-curves`는 `{id}`와 충돌하기 쉬움 |\n| R12 | PZ 저장 후 evalresp로 검증. 실패하면 **트랜잭션 롤백** (blob 불변) | 깨진 응답을 DB에 남기지 않음 |\n| R13 | A0(`normalization_factor`)는 저장 시 재계산. 전체 InstrumentSensitivity는 건드리지 않음 | 단계 이득과 센서 PZ를 섞지 않음 |\n| R14 | 켤레 짝이 아니면 **경고 후 저장**(200). evalresp 실패만 400 | 강제 짝맞추기는 하지 않음 |\n\n구현 순서는 **단곡선 → 겹치기 → PNG → PZ 편집**. PZ가 데이터 원본을 바꾸므로 마지막이다.\n\n---\n\n## 화면\n\n```mermaid\nflowchart TB\n  table[채널 표]\n  table -->|행 클릭| primary[주 선택 1채널]\n  table -->|체크박스| overlay[겹치기 집합 최대 8]\n  primary -->|체크 0개| api1[\"GET .../channels/id/response-curve\"]\n  overlay -->|체크 1개 이상| apiN[\"GET /api/response-curves?ids=\"]\n  api1 --> chart[진폭 + 위상]\n  apiN --> chart\n  chart --> png[PNG 저장]\n  primary --> pz[Poles/Zeros 표]\n  pz -->|저장| blob[response_xml 갱신]\n  blob --> api1\n```\n\n- 위: 기존 채널 표. 첫 열에 겹치기 체크박스. 행 클릭은 주 선택(하이라이트).\n- 아래: 곡선 패널. 주 선택이 있고 응답이 있으면 PZ 패널을 펼 수 있다.\n- **곡선 대상**\n  - 체크 0개: 주 선택만 (단채널 API).\n  - 체크 1–8개: 체크된 채널만 (배치 API). 주 선택이 체크되어 있지 않으면 곡선에 안 그린다.\n- `has_response`가 아닌 행은 체크 불가(비활성). 9번째 체크는 거절 토스트: `겹치기는 최대 8채널입니다`.\n- 헤더: 주 선택 NSLC·시작·센서/기록계·`response_source`. 겹치면 범례에 최대 8개 NSLC.\n- 컨트롤: `DIS | VEL | ACC`, 새로고침, **PNG 저장**(곡선이 있을 때만), (주 선택) **Poles/Zeros**.\n- 응답 없음(주 선택, 체크 0개): `이 채널에는 계측기 응답이 없습니다. StationXML/SEED를 가져오거나 NRL을 적용하세요.`\n- 겹치기 부분 실패: 성공분 곡선 + 위 경고 `KG.BUS.--.HHN: 계측기 응답이 없습니다`.\n- 배치 결과가 전부 실패: 빈 축 대신 안내. HTTP는 200.\n\n관측소 탭에는 곡선을 두지 않는다. 채널 수정 모달과 곡선 패널은 별개다.\n\n---\n\n## API\n\n### 단채널 곡선\n\n`GET /api/channels/{channel_id}/response-curve`\n\n| 쿼리 | 기본 | 설명 |\n|------|------|------|\n| `output` | `VEL` | `DIS` / `VEL` / `ACC` |\n| `min_freq` | `0.001` | Hz |\n| `max_freq` | `min(sps/2, 100)` | Nyquist 초과는 400 |\n| `npts` | `200` | 50–1000 |\n\n**200** 본문: `channel_id`, `nslc`, `start_time`, `sample_rate`, `output`, `input_units`, `output_units`, `frequencies`, `amplitude`, `phase_deg`, `response_source`.\n\n### 겹치기 (R3, R11)\n\n`GET /api/response-curves?ids=1,2,3&output=VEL&min_freq=0.001&npts=200`\n\n- `ids` 1–8개(쉼표). 중복 제거, 순서 유지. 빈 값·9개 이상·숫자가 아니면 400.\n- `max_freq`를 주면 그 값을 쓰고, 선택한 채널 Nyquist 최솟값보다 크면 400.\n- `max_freq` 생략 시 `min(각 채널 Nyquist, 100)`. 응답 없는 채널의 sps는 격자 계산에 **포함**한다 (목록에 올린 채널의 공통 대역).\n- **200** (부분 성공 허용):\n\n```json\n{\n  \"output\": \"VEL\",\n  \"min_freq\": 0.001,\n  \"max_freq\": 50,\n  \"npts\": 200,\n  \"frequencies\": [0.001, 0.0011],\n  \"series\": [\n    {\n      \"channel_id\": 1,\n      \"nslc\": \"KG.SEO.--.HHZ\",\n      \"start_time\": \"2020-01-01T00:00:00\",\n      \"sample_rate\": 100,\n      \"amplitude\": [],\n      \"phase_deg\": [],\n      \"response_source\": \"nrl\"\n    }\n  ],\n  \"errors\": [\n    {\"channel_id\": 2, \"nslc\": \"KG.BUS.--.HHN\", \"reason\": \"계측기 응답이 없습니다\"}\n  ]\n}\n```\n\n`series`가 비고 `errors`만 있어도 200. 클라이언트가 안내를 보여 준다.\n\n단채널 API를 N번 호출하지 않는다. 겹치기는 **공통 주파수**가 필요하므로 배치 API만 쓴다.\n\n### Poles/Zeros 읽기·저장 (R9, R10, R12–R14)\n\n`GET /api/channels/{channel_id}/response-stages`\n\n```json\n{\n  \"channel_id\": 1,\n  \"nslc\": \"KG.SEO.--.HHZ\",\n  \"response_source\": \"imported\",\n  \"stages\": [\n    {\n      \"stage_sequence_number\": 1,\n      \"type\": \"PolesZeros\",\n      \"editable\": true,\n      \"input_units\": \"M/S\",\n      \"output_units\": \"V\",\n      \"pz_transfer_function_type\": \"LAPLACE (RADIANS/SECOND)\",\n      \"normalization_frequency\": 1.0,\n      \"normalization_factor\": 1.0,\n      \"stage_gain\": 2000.0,\n      \"stage_gain_frequency\": 1.0,\n      \"poles\": [{\"real\": -0.037, \"imag\": 0.037}],\n      \"zeros\": [{\"real\": 0.0, \"imag\": 0.0}]\n    },\n    {\n      \"stage_sequence_number\": 3,\n      \"type\": \"Coefficients\",\n      \"editable\": false,\n      \"input_units\": \"V\",\n      \"output_units\": \"COUNTS\"\n    }\n  ]\n}\n```\n\n- PZ가 아니면 `poles`/`zeros`를 주지 않고 `editable: false`.\n- `pz_transfer_function_type`은 표시만. PUT으로 바꾸지 않는다.\n\n`PUT /api/channels/{channel_id}/response-stages/{stage_number}?actor=`\n\n```json\n{\n  \"poles\": [{\"real\": -0.037, \"imag\": 0.037}, {\"real\": -0.037, \"imag\": -0.037}],\n  \"zeros\": [{\"real\": 0.0, \"imag\": 0.0}],\n  \"stage_gain\": 2000.0,\n  \"normalization_frequency\": 1.0\n}\n```\n\n허용 필드만 받는다. `pz_transfer_function_type`, `normalization_factor`, FIR 계수는 거절(400).\n\n저장 절차 (한 트랜잭션):\n\n1. 현재 `response_xml`을 읽는다. 없으면 400.\n2. ObsPy로 Response를 연다. `stage_sequence_number`가 PZ가 아니면 400.\n3. poles/zeros/stage_gain/normalization_frequency를 넣는다. 극·영점은 각 최대 64개. 유한 실수만.\n4. 해당 단계 A0를 재계산한다. **InstrumentSensitivity / 다른 단계는 그대로**.\n5. blob으로 직렬화한 뒤, 기본 격자에서 evalresp를 한 번 돌린다.\n6. evalresp 실패 → 롤백, 400. 성공 → `response_source=edited`, audit, 커밋.\n7. 응답 본문은 GET stages와 같고, 켤레 경고가 있으면 `warnings: [\"켤레가 아닌 극이 있습니다\"]`.\n\n감사 기록:\n\n- `action=update`, `entity_type=channel`, `summary=Poles/Zeros 수정 (stage 1)`.\n- `before_json` / `after_json`에는 **해당 단계 스냅샷만** (poles, zeros, gain, fnorm, A0, `response_source`). `response_xml` 전문은 넣지 않는다.\n\n곡선은 클라이언트가 단채널 또는 배치 GET을 다시 호출한다.\n\n**오류**\n\n| 상황 | 코드 | detail 예 |\n|------|------|-----------|\n| 채널 없음 | 404 | 채널을 찾을 수 없습니다 |\n| 응답 없음 | 400 | KG.SEO.--.HHZ: 계측기 응답이 없습니다 |\n| 주파수/output 잘못 | 400 | max_freq는 Nyquist 이하여야 합니다 |\n| ids 9개 이상 | 400 | 겹치기는 최대 8채널입니다 |\n| evalresp 실패 (단채널 GET) | 400 | KG.SEO.--.HHZ: 응답 곡선을 계산하지 못했습니다: … |\n| evalresp 실패 (PZ PUT) | 400 | KG.SEO.--.HHZ: 수정한 응답을 계산하지 못해 저장하지 않았습니다: … |\n| PZ 단계 아님 | 400 | stage 3은 Poles/Zeros가 아닙니다 |\n| 허용 외 필드 | 400 | normalization_factor는 직접 수정할 수 없습니다 |\n| 켤레 짝 불일치 | **200** + `warnings` | 켤레가 아닌 극이 있습니다 |\n\n서버 로그: `ERROR/WARNING stationxml_manager.response` + NSLC + 원인.\n\n---\n\n## 계산\n\n`load_response` 후 `get_evalresp_response_for_frequencies`.\n\n- 단채널: 그 채널 격자, `max_freq = min(요청 또는 Nyquist, 100)`.\n- 겹치기: 공통 로그 격자, `max_freq = min(각 Nyquist, 요청값, 100)`.\n- 곡선은 **합성 응답** 한 줄/채널. 단계별 분해 곡선은 범위 밖.\n- 캐시 없음. PZ 저장 직후 다시 계산하면 새 blob을 쓴다.\n\n---\n\n## 겹치기 (R3, R11)\n\n채널 표 체크와 주 선택은 독립이다.\n\n- 색: 고정 8색, 색맹 구분 가능한 팔레트. 체크 순서 = 색 인덱스.\n- 범례: `NSLC`. 같은 NSLC가 시작시간이 다르면 `NSLC 2020-01-01`처럼 날짜를 붙인다.\n- 호버: 해당 곡선만 강조, 나머지는 흐리게. 툴팁에 NSLC·주파수·진폭·위상.\n- 체크 해제·단위 변경·새로고침: 배치 API를 다시 호출.\n- 필터로 표에서 사라진 채널은 체크 집합에서 빼지 않는다. 다시 보이면 체크 유지. 탭을 떠나면 체크는 초기화해도 된다 (세션 저장 없음).\n\nS11(dataless 전체 실패)과 달리, 여기 실패는 **부분 성공**이 기본이다.\n\n---\n\n## PNG 저장 (R8)\n\nPPSD_v1 `frontend/src/charts/exportPng.ts`와 같이 **보이는 SVG를 캔버스에 그려 PNG**로 받는다. 응답 차트는 WebGL이 없으므로 SVG만 래스터하면 된다.\n\n- 버튼 **PNG 저장**. `series`가 1개 이상일 때만 활성.\n- 파일명:\n  - 단채널(체크 0개 또는 성공 1개): `{NSLC}_{OUTPUT}_response.png`  \n    예: `KG.SEO.--.HHZ_VEL_response.png`\n  - 겹치기(성공 2개 이상): `response_compare_{N}ch_{OUTPUT}.png`  \n    예: `response_compare_3ch_VEL.png`\n- 그림 안에 넣을 것: 제목(단채널 NSLC 또는 `응답 비교 (N채널)`), 출력 단위, 두 패널, 축 제목, 범례, 부분 실패가 있으면 작은 주석.\n- 픽셀은 CSS 크기의 2배(레티나, 상한 3배). 배경은 현재 테마(밝음/어둠)와 같게. PPSD exportPng의 고정 흰 배경을 그대로 쓰지 않는다.\n- 텍스트는 SVG `\u003ctext>`만 쓴다 (`foreignObject` 금지). 래스터가 깨지지 않게.\n- 서버 `/api/export/response.png`는 두지 않는다. 화면과 다른 그림이 나오지 않게.\n\n---\n\n## Poles/Zeros 편집 (R9, R10, R12–R14)\n\n주 선택 채널만 편집한다. 겹친 다른 채널의 PZ는 열지 않는다.\n\n- PZ 단계마다 접는 표. 극/영점 행: 실수·허수. 행 추가/삭제.\n- 단계 게인·정규화 주파수는 수정 가능. A0는 읽기 전용(저장 시 재계산 안내).\n- `pz_transfer_function_type`·입력/출력 단위는 읽기 전용.\n- FIR / Coefficients / Polynomial / ResponseList 단계는 이름·단위만 읽기 전용.\n- **저장** 전 확인: `계측기 응답을 수정합니다. 곡선과 Dataless SEED 내용이 바뀝니다. 계속할까요?`\n- 켤레가 아니면 저장은 하고 노란 경고. 자동으로 켤레를 만들지 않는다.\n- 저장 성공 후 주 선택 곡선(그리고 그 채널이 체크되어 있으면 겹치기)을 다시 그린다. 표의 응답 칸은 `edited`.\n- NRL을 다시 적용하면 `edited`가 `nrl`로 덮인다 (기존 NRL 확인과 동일).\n- 엑셀 재가져오기의 응답 보존 규칙 그대로: NSLC+시작이 같으면 `edited` blob도 유지. StationXML/SEED로 같은 채널을 다시 가져오면 `imported`가 덮는다.\n- blob 전체 XML 편집기는 두지 않는다.\n\n`response_source` 열은 `String(16)`이라 `edited`(6)는 스키마 변경 없이 추가한다. README의 출처 목록(`none` / `imported` / `nrl`)은 구현 때 `edited`를 덧붙인다.\n\n---\n\n## 프론트\n\n`d3` + `src/charts/responseCurve.ts` (다중 series) + `src/charts/exportResponsePng.ts`.\n\n- 위 진폭 로그–로그, 아래 위상 로그 x · 선형 ° (−180~180 또는 데이터 범위).\n- 리사이즈 시 재렌더. PNG는 그 SVG를 래스터.\n- 채널 탭을 목록 + 아래 차트 패널로 나눈다. 기존 수정/NRL/삭제 버튼은 유지.\n\n---\n\n## 구현 단계\n\n1. 단채널 `eval_response_curve` + GET + 테스트.\n2. 채널 탭 주 선택·빈 안내·D3 단곡선·단위 전환.\n3. 체크박스 + `GET /api/response-curves` + 범례·부분 실패.\n4. PNG 저장 (단곡선·겹치기 모두, 테마 배경).\n5. stages GET/PUT, 확인, A0 재계산, evalresp 검증·롤백, audit, 저장 후 곡선 갱신.\n6. README 출처에 `edited` 추가, 이 문서 체크리스트.\n\nSEED(v1.1)와 병행할 필요 없다. blob만 있으면 된다.\n\n---\n\n## 테스트 (구현 시)\n\n- 단채널: 응답 있음 / 없음 / Nyquist 초과 / 잘못된 output.\n- 겹치기: 공통 `max_freq` = min Nyquist, ids 9개 → 400, 일부 없음 → 200 + `errors`, 전부 없음 → 200 + 빈 `series`.\n- PZ: FIR PUT → 400, 허용 외 필드 → 400, 성공 후 `response_source=edited`·audit 단계 스냅샷, evalresp 실패 시 blob 불변, 켤레 불일치 → 200 + warnings.\n- PNG는 프론트 헬퍼(파일명)만 단위 테스트. 서버 PNG API는 없음.\n\n---\n\n## 이번 범위 밖\n\n- 단계별(센서만 / 기록계만) 곡선\n- 관측소 탭에 전 채널 곡선 나열\n- 차트에서 극·영점을 드래그로 이동\n- 응답 XML 원문 편집\n- A0·변환함수 유형·InstrumentSensitivity 직접 수정\n- 서버 matplotlib PNG\n- 겹치기 집합을 로컬스토리지에 저장\n\n---\n\n## 위험\n\n| 위험 | 대응 |\n|------|------|\n| evalresp 실패 | R7 로그. 단채널 GET은 400, 겹치기는 해당 채널만 `errors`, PZ PUT은 롤백 후 400 |\n| PZ 수정으로 SEED 내보내기 실패 | S11·S12가 NSLC를 보여 줌. 저장 확인 문구로 인지 |\n| 8채널·npts 1000 느림 | npts 기본 200, 상한 8 |\n| PNG와 화면 불일치 | 서버 렌더 없이 SVG 래스터만. 테마 배경을 같이 그림 |\n| 켤레 아닌 극 | 경고 후 저장. 계산이 안 되면 PUT 롤백 |\n| `/api/channels/response-curves` 라우팅 충돌 | R11, 최상위 `/api/response-curves` |\n| audit에 blob 전문 | 단계 스냅샷만 기록 |\n",
  "CUSTOM_EQUIPMENT.md": "# NRL에 없는 장비 — 사용자 정의 메타데이터\n\n상태: **제안** (코드 미착수). 아래 **선택이 필요한 항목**에 답이 오면 결정을 잠근다.\n\nNRL 사전에 없는 센서·기록계도 제조사·모델·일련번호 등을 넣고, StationXML 장비 칸에 나가게 한다. 채널의 `extra` 키-값은 만들지 않는다 (v1 결정 4).\n\n---\n\n## 지금 빈칸\n\n카탈로그에는 이미 NRL 키 없는 항목을 넣을 수 있다 (`nrl_keys` 빈 값, 카탈로그 탭 추가). 그래도 아래가 막혀 있다.\n\n| 상황 | 지금 |\n|------|------|\n| 채널 수정 | 카탈로그 ID 드롭다운만. 목록에 없으면 제조사·모델을 채널에서 바로 못 넣음 |\n| StationXML 가져오기 | 제조사·모델이 카탈로그와 안 맞으면 `sensor_id`/`datalogger_id`가 비고, **제조사·모델 문자열은 버려짐**. 일련번호·유형만 채널에 남음 |\n| 엑셀 | 카탈로그에 없는 ID는 거절 |\n| NRL 버튼 | 키가 없으면 400 |\n| 응답 | NRL 키가 없으면 응답을 새로 만들 방법이 없음 (가져오기 blob 또는 이후 PZ 편집) |\n\n시드 YAML에도 키가 빈 장비가 있다 (`Trillium120QA`, `Centaur`, `Episensor` 등). 메타데이터는 되지만 NRL·곡선·dataless는 응답이 따로 있어야 한다.\n\n---\n\n## 선택이 필요한 항목 (다지선다)\n\n구현 전에 답을 고른다. 괄호는 문서 작성 시점의 **제안 기본값**이다.\n\n### Q1. 사용자 정의 장비는 어디에 저장하나?\n\n- **A (제안).** 카탈로그 행으로 저장 (`origin=custom`). 채널은 지금처럼 ID만 가리킨다. 같은 장비를 여러 채널이 재사용.\n- **B.** 채널에 제조사·모델을 직접 저장하고 카탈로그를 우회한다.\n- **C.** 카탈로그 + 채널별 제조사·모델 덮어쓰기.\n\nB·C는 v1 “카탈로그 ID만”과 엑셀 드롭다운이 깨진다.\n\n### Q2. 사용자 정의 장비의 계측기 응답은?\n\n- **A (제안).** 이 단계에서는 **메타데이터만**. 응답은 StationXML/SEED 가져오기, 이후 PZ로 새로 만들기, 또는 나중에 NRL 키를 채운 뒤 NRL 적용.\n- **B.** 같은 화면에서 Poles/Zeros + 단계 게인으로 응답을 **처음부터** 만든다 (`response_source=custom`).\n- **C.** StationXML Response 조각 파일만 업로드.\n- **D.** B와 C 둘 다.\n\nA면 사용자 정의 장비만 있는 채널은 dataless S11에서 막힌다. B·D는 응답 곡선 PZ와 API를 공유한다.\n\n### Q3. StationXML/SEED에서 카탈로그에 없는 장비는?\n\n- **A (제안).** 제조사·모델이 있으면 `origin=custom` 카탈로그 항목을 **자동 생성**하고 ID를 연결. 같은 제조사·모델·(기록계면 sps)가 있으면 재사용.\n- **B.** 지금처럼 ID를 비우고 경고. 제조사·모델은 계속 버려짐.\n- **C.** ID는 비우되 채널에 제조사·모델 열을 추가해 보관 (Q1-B와 같음).\n\n### Q4. 엑셀에서 없는 장비 ID는?\n\n- **A (제안).** 지금처럼 거절. 카탈로그 시트에 먼저 넣거나, 웹에서 사용자 정의로 만든 뒤 ID를 쓴다.\n- **B.** 채널 행의 새 열(제조사·모델)로 카탈로그를 자동 생성.\n- **C.** 알 수 없는 ID면 제조사·모델이 비어 있어도 `CUSTOM_\u003cID>` 항목을 만든다.\n\n### Q5. 사용자 정의 카탈로그 ID는 누가 정하나?\n\n- **A.** 사용자가 항상 직접 입력.\n- **B (제안).** 비우면 `CUSTOM_{제조사}_{모델}` (기록계는 `_100sps` 등). 충돌하면 `_2`. 사용자가 쓰면 그 값을 사용.\n- **C.** 항상 자동. 사용자는 제조사·모델만.\n\n### Q6. NRL 키가 없는 채널의 NRL 버튼은?\n\n- **A (제안).** 비활성. 안내: `이 장비는 NRL 키가 없습니다. 사용자 정의 응답을 쓰거나 카탈로그에 키를 넣으세요.`\n- **B.** 지금은 그대로 누르면 400.\n- **C.** 센서·기록계 중 키 있는 쪽만 NRL (보통 실패하므로 비추천).\n\n### Q7. 구현 순서는?\n\n- **A.** 단곡선 → 겹치기 → PNG → PZ (기존 응답 곡선 계획).\n- **B.** dataless SEED부터.\n- **C (제안).** **사용자 정의 장비 메타데이터**를 곡선/SEED보다 먼저. 응답 생성(Q2-B)은 PZ와 같이.\n- **D.** 단곡선과 사용자 정의 장비를 같이.\n\n### Q8. 겹치기 최대 채널 수는? (응답 곡선 R3)\n\n- **A (제안).** 8\n- **B.** 4\n- **C.** 제한 없음 (성능 위험)\n\n### Q9. 나중에 같은 장비에 NRL 키를 넣으면?\n\n- **A (제안).** 카탈로그만 갱신. 이미 `custom`/`edited`/`imported`인 채널 응답은 덮지 않음. NRL은 채널마다 버튼을 눌러야 함.\n- **B.** 키를 넣는 순간 그 ID를 쓰는 모든 채널에 NRL을 다시 적용 (확인 후).\n\n---\n\n## 답이 오기 전 가정 (Q 기본값)\n\nQ1-A, Q2-A, Q3-A, Q4-A, Q5-B, Q6-A, Q7-C, Q8-A, Q9-A.\n\n답이 바뀌면 이 절과 아래 표를 고친다.\n\n---\n\n## 확정으로 제안하는 결정\n\n| # | 제안 | 이유 |\n|---|------|------|\n| C1 | 채널 장비 FK는 계속 카탈로그 ID만 | v1 결정 4, 엑셀 드롭다운, 재사용 |\n| C2 | 카탈로그에 `origin` (`seed` / `custom`)과 선택 `description` | NRL 시드와 현장 장비를 구분. 임의 키-값은 없음 |\n| C3 | NRL 키는 선택. 없으면 NRL 적용 불가 (Q6) | 지금 `apply_nrl`과 같음 |\n| C4 | 채널 모달에 **목록에 없음** → 제조사·모델·(기록계 sps)·설명·ID(선택) | 카탈로그 탭을 몰라도 입력 가능 |\n| C5 | StationXML 미매칭 장비는 custom 카탈로그로 승격 (Q3-A) | 지금처럼 제조사·모델이 사라지지 않게 |\n| C6 | 엑셀 채널 시트에 제조사·모델 열을 열지 않음 (Q4-A) | 스키마 고정. 카탈로그 시트 / 웹으로만 추가 |\n| C7 | 사용자 정의 응답 생성은 Q2가 B/D일 때만. 기본(A)은 메타만 | PZ·곡선 계획과 순서를 맞춤 |\n| C8 | `response_source=custom`은 Q2-B/D로 **처음부터** 만든 응답에만 | 가져온 blob은 `imported`, NRL은 `nrl`, PZ 수정은 `edited` |\n\n---\n\n## 화면\n\n```mermaid\nflowchart TB\n  ch[채널 수정 모달]\n  ch --> pick{센서/기록계}\n  pick -->|카탈로그 ID| id[기존 드롭다운]\n  pick -->|목록에 없음| form[제조사 모델 sps 설명 ID]\n  form --> cat[카탈로그 origin=custom]\n  cat --> id\n  xml[StationXML 가져오기] -->|미매칭| cat\n  id --> nrl{nrl_keys?}\n  nrl -->|있음| btn[NRL 버튼]\n  nrl -->|없음| hide[버튼 비활성 + 안내]\n```\n\n채널 수정:\n\n- 센서/기록계 `\u003cselect>` 마지막에 `목록에 없음…`.\n- 고르면 같은 모달에 제조사·모델 필수, 기록계는 sps 필수, 설명·ID 선택.\n- 저장 시 카탈로그 POST 후 그 ID를 채널에 넣는다. 제조사·모델·sps가 이미 있으면 그 행을 쓰고 새로 만들지 않는다 (대소문자 무시, 기록계는 sps 포함).\n- 드롭다운 라벨: `Guralp_CMG-3T (NRL)` / `Acme_Geophone (사용자 정의)`.\n- NRL 키가 없으면 NRL 버튼 비활성 (Q6-A).\n\n카탈로그 탭:\n\n- `origin` 열: 시드 / 사용자 정의.\n- 설명 칸. NRL 키는 계속 선택.\n- 사용 중 삭제 금지는 그대로.\n\n관측소 탭에는 장비 입력을 두지 않는다.\n\n---\n\n## 데이터\n\n`equipment_catalog`에 열 추가 (SQLite는 앱 시작 시 `ALTER` 또는 재생성 안내).\n\n| 열 | 형 | 설명 |\n|----|----|------|\n| `origin` | `String(16)` 기본 `seed` | `seed` 또는 `custom` |\n| `description` | `Text` 선택 | 비고. 응답 수식은 넣지 않음 |\n\n기존 시드 행은 `origin=seed`. YAML 시드에도 `origin`은 넣지 않고 적재 시 `seed`로 둔다.\n\n채널 테이블은 그대로다. 일련번호·유형·설치/철거일은 지금처럼 채널 칸.\n\n허용 메타데이터 (고정 스키마, extra 없음):\n\n- 카탈로그: ID, 제조사, 모델, 기록계 sps, NRL 키(선택), 설명, origin\n- 채널: 일련번호, 유형, 설치일, 철거일\n\n넣지 않는 것: 임의 JSON, 벤더 URL, 채널별 제조사 덮어쓰기(Q1-A).\n\n---\n\n## API\n\n기존 `POST /api/catalog`에 `origin` (기본 `custom` — 웹에서 만들면 custom, 시드만 seed), `description`.\n\n채널 저장은 지금처럼 `sensor_id` / `datalogger_id`만. “목록에 없음”은 프론트가 카탈로그를 만든 뒤 ID를 넣는다.\n\n가져오기 경고 예: `KG.SEO.--.HHZ: 카탈로그에 없는 센서 Guralp / CMG-3ESP를 사용자 정의 항목 CUSTOM_Guralp_CMG-3ESP로 추가했습니다`.\n\nNRL 키가 없는데 `POST .../apply-nrl` → 400 유지. UI만 버튼을 숨긴다.\n\nQ2-B/D를 고르면 추가로:\n\n- `POST /api/channels/{id}/custom-response` — PZ 단계 + 전체 sensitivity로 blob 생성. 기존 blob이 있으면 확인 후에만 덮음.\n- 또는 응답 곡선 계획의 stages API를 “응답 없음 → 생성”까지 확장.\n\n---\n\n## 가져오기 · 내보내기\n\nStationXML (C5):\n\n1. 지금처럼 제조사·모델·(기록계 sps)로 카탈로그 매칭.\n2. 실패하고 제조사·모델이 있으면 custom 항목 생성/재사용 후 ID 연결.\n3. 장비 칸이 비어 있으면 ID는 비움 (지금과 같음).\n4. 응답 blob이 있으면 `imported` (장비 origin과 무관).\n\n엑셀 (C6): 카탈로그 시트에 `origin`, `description` 열을 추가. 채널 시트는 그대로 ID만.\n\n내보내기: 카탈로그 제조사·모델이 StationXML `Equipment`로 나간다. custom도 seed와 같다. NRL 키는 StationXML에 쓰지 않는다.\n\ndataless S8: B33 문자열은 카탈로그 제조사·모델. custom도 동일.\n\n---\n\n## 응답 곡선 · SEED와의 관계\n\n- 사용자 정의 장비 + 응답 없음 → 곡선 안내, dataless S11 실패 목록에 그 NSLC.\n- Q2-A면 “응답 처음부터 만들기”는 PZ 구현 때 다시 연다.\n- Q2-B면 PZ보다 먼저 `custom-response` 생성이 필요하다.\n\n---\n\n## 구현 단계 (Q7-C 기준)\n\n1. `origin` / `description` 열, 카탈로그 API·엑셀 시트, 시드 행은 `seed`.\n2. 채널 모달 “목록에 없음”, 중복 제조사·모델 재사용, ID 자동(Q5-B).\n3. StationXML 미매칭 → custom 승격 + 경고 (C5).\n4. NRL 버튼 비활성 안내 (Q6-A).\n5. README·카탈로그 탭 라벨.\n6. Q2-B/D이면 응답 생성 API (곡선/PZ와 맞춤).\n\n---\n\n## 테스트 (구현 시)\n\n- 목록에 없음 → 카탈로그 `origin=custom` + 채널 ID.\n- 같은 제조사·모델 두 번째 채널은 행을 재사용.\n- StationXML 미매칭 장비가 재내보내기에서 제조사·모델이 살아 있음.\n- 엑셀에 없는 센서ID는 계속 400 (Q4-A).\n- NRL 키 없는 항목에 apply-nrl → 400.\n- 사용 중 custom 항목 삭제 불가.\n\n---\n\n## 이번 범위 밖\n\n- 채널 `extra` 키-값, 알 수 없는 엑셀 열 흡수\n- NRL 트리를 앱 안에서 탐색하는 브라우저\n- 제조사 로고·데이터시트 파일 첨부\n- 채널마다 다른 제조사로 같은 ID를 덮어쓰기\n- FIR 계수를 손으로 넣는 기록계 응답 설계기 (Q2-B여도 PZ+게인만)\n\n---\n\n## 위험\n\n| 위험 | 대응 |\n|------|------|\n| 자동 생성 ID가 시드 ID와 충돌 | 충돌 시 `_2`. 시드 코드 규칙(`Guralp_…`)과 `CUSTOM_` 접두로 구분 |\n| 가져오기마다 custom 행이 늘어남 | 제조사·모델·sps로 재사용 |\n| custom만 있고 응답 없음인데 dataless 요청 | S11·S12가 NSLC를 보여 줌 |\n| Q1-B로 바꾸면 엑셀·내보내기 분기 | 기본은 Q1-A로 고정해 분기 없음 |\n"
};

    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    const savedTheme = localStorage.getItem("sxm-docs-theme");
    let theme = savedTheme || (prefersDark.matches ? "dark" : "light");

    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("sxm-docs-theme", theme);
    }
    applyTheme();

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "loose",
      theme: theme === "dark" ? "dark" : "neutral",
    });

    marked.setOptions({ gfm: true, breaks: false });

    const slugCounts = new Map();
    function slugify(text) {
      const base = String(text)
        .toLowerCase()
        .replace(/[`*_]/g, "")
        .replace(/[^\p{L}\p{N}]+/gu, "-")
        .replace(/^-+|-+$/g, "") || "section";
      const n = (slugCounts.get(base) || 0) + 1;
      slugCounts.set(base, n);
      return n === 1 ? base : `${base}-${n}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const renderer = new marked.Renderer();
    renderer.code = ({ text, lang }) => {
      const language = (lang || "").trim().toLowerCase();
      if (language === "mermaid") {
        return `<pre class="mermaid">${escapeHtml(text)}</pre>`;
      }
      const cls = language ? ` class="language-${escapeHtml(language)}"` : "";
      return `<pre><code${cls}>${escapeHtml(text)}</code></pre>`;
    };
    renderer.heading = ({ text, depth }) => {
      const id = slugify(text.replace(/<[^>]+>/g, ""));
      return `<h${depth} id="${id}"><a class="anchor" href="#${id}">#</a>${text}</h${depth}>`;
    };
    marked.use({ renderer });

    const state = {
      current: FILES[0].id,
      sources: {},
      status: "loading",
    };

    async function loadMarkdown(file) {
      try {
        const res = await fetch(file.path, { cache: "no-store" });
        if (!res.ok) throw new Error(`${res.status}`);
        return { text: await res.text(), origin: "file" };
      } catch {
        const embedded = EMBEDDED_DOCS[file.path];
        if (typeof embedded === "string" && embedded.trim()) {
          return { text: embedded, origin: "embedded" };
        }
        throw new Error("missing");
      }
    }

    async function loadAll() {
      const results = await Promise.all(
        FILES.map(async (file) => {
          try {
            const loaded = await loadMarkdown(file);
            return { id: file.id, ...loaded, error: null };
          } catch {
            return { id: file.id, text: "", origin: "none", error: true };
          }
        })
      );
      for (const row of results) {
        state.sources[row.id] = row;
      }
      const any = results.some((row) => !row.error);
      state.status = any ? "ready" : "empty";
    }

    function buildToc(root) {
      const headings = [...root.querySelectorAll("h2, h3")];
      if (!headings.length) return "";
      return headings
        .map((el) => {
          const level = el.tagName === "H2" ? "h2" : "h3";
          return `<a class="toc-link ${level}" href="#${el.id}">${el.textContent.replace(/^#/, "").trim()}</a>`;
        })
        .join("");
    }

    async function renderCurrent() {
      slugCounts.clear();
      const file = FILES.find((f) => f.id === state.current);
      const source = state.sources[file.id];
      const article = document.getElementById("article");
      const toc = document.getElementById("toc");
      const badge = document.getElementById("source-badge");
      const empty = document.getElementById("empty-state");

      document.querySelectorAll("[data-doc]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.doc === file.id);
      });

      if (!source || source.error || !source.text) {
        article.innerHTML = "";
        toc.innerHTML = "";
        empty.hidden = false;
        badge.textContent = "파일 없음";
        badge.dataset.origin = "none";
        return;
      }

      empty.hidden = true;
      article.innerHTML = marked.parse(source.text);
      toc.innerHTML = `<p class="toc-title">목차</p>${buildToc(article)}`;
      badge.textContent =
        source.origin === "file"
          ? `${file.path} (최신)`
          : source.origin === "local"
            ? "로컬 파일"
            : `${file.path} (내장 사본)`;
      badge.dataset.origin = source.origin;

      const nodes = article.querySelectorAll("pre.mermaid");
      if (nodes.length) {
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: "loose",
          theme: theme === "dark" ? "dark" : "neutral",
        });
        await mermaid.run({ nodes });
      }

      if (location.hash) {
        const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }
    }

    function setDoc(id) {
      state.current = id;
      history.replaceState(null, "", `#doc-${id}`);
      renderCurrent();
    }

    async function boot() {
      const hash = location.hash.replace(/^#/, "");
      if (hash.startsWith("doc-")) {
        const id = hash.slice(4);
        if (FILES.some((f) => f.id === id)) state.current = id;
      }
      await loadAll();
      document.getElementById("shell").dataset.status = state.status;
      await renderCurrent();
    }

    document.getElementById("theme-toggle").addEventListener("click", async () => {
      theme = theme === "dark" ? "light" : "dark";
      applyTheme();
      await renderCurrent();
    });

    document.querySelectorAll("[data-doc]").forEach((btn) => {
      btn.addEventListener("click", () => setDoc(btn.dataset.doc));
    });

    document.getElementById("open-file").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const text = await file.text();
      const target = FILES.find((f) => f.path.toLowerCase() === file.name.toLowerCase()) || FILES.find((f) => f.id === state.current);
      state.sources[target.id] = { text, origin: "local", error: null };
      state.status = "ready";
      document.getElementById("shell").dataset.status = "ready";
      setDoc(target.id);
      event.target.value = "";
    });

    boot();
  </script>
  <style>
    :root {
      --fg: #1f2328;
      --muted: #57606a;
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --border: #d7d2c8;
      --accent: #0b6e4f;
      --accent-soft: #d8eee4;
      --code-bg: #eef2f4;
      --code-fg: #24292f;
      --pre-bg: #1c2430;
      --pre-fg: #e8eef2;
      --shadow: 0 10px 30px rgba(28, 36, 48, 0.08);
    }
    [data-theme="dark"] {
      --fg: #e6edf3;
      --muted: #8b949e;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #3fb950;
      --accent-soft: #163227;
      --code-bg: #21262d;
      --code-fg: #e6edf3;
      --pre-bg: #0d1117;
      --pre-fg: #e6edf3;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 8% -12%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
        var(--bg);
      color: var(--fg);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .top-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .brand {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
    }
    .tabs { display: flex; gap: 0.4rem; }
    .tabs button, .tool {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--fg);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .tools { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; }
    .badge {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
    }
    .layout {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 1.25rem;
    }
    .toc {
      position: sticky;
      top: 76px;
      align-self: start;
      max-height: calc(100vh - 96px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 0.8rem;
      box-shadow: var(--shadow);
    }
    .toc-title {
      margin: 0 0 0.5rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .toc-link {
      display: block;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.86rem;
      padding: 0.22rem 0.3rem;
      border-radius: 6px;
    }
    .toc-link.h3 { padding-left: 0.9rem; font-size: 0.8rem; }
    .toc-link:hover { background: var(--accent-soft); color: var(--fg); }
    article {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem 1.6rem 2.4rem;
      box-shadow: var(--shadow);
      min-height: 60vh;
    }
    article h1 { margin-top: 0; font-size: 1.9rem; line-height: 1.25; }
    article h2 {
      margin-top: 2.1rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--border);
      font-size: 1.35rem;
      color: var(--accent);
    }
    article h3 { margin-top: 1.5rem; font-size: 1.08rem; }
    article a { color: var(--accent); }
    .anchor {
      margin-right: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.3rem;
      font-size: 0.92rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
      text-align: left;
    }
    th { background: var(--accent-soft); }
    code {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.86rem;
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: var(--pre-bg);
      color: var(--pre-fg);
      padding: 1rem 1.05rem;
      border-radius: 12px;
      overflow-x: auto;
    }
    pre code { background: transparent; color: inherit; padding: 0; }
    pre.mermaid {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      text-align: center;
    }
    blockquote {
      margin: 1rem 0;
      padding: 0.55rem 0.9rem;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
    }
    .empty {
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 2rem;
    }
    footer {
      max-width: 1180px;
      margin: 0 auto 2rem;
      padding: 0 1.25rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .toc { position: static; max-height: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <p class="brand">StationXML 문서</p>
      <nav class="tabs">
        <button type="button" data-doc="readme" class="active">사용법</button>
        <button type="button" data-doc="plan">계획</button>
        <button type="button" data-doc="seed">SEED</button>
        <button type="button" data-doc="curve">응답곡선</button>
        <button type="button" data-doc="custom">사용자정의</button>
      </nav>
      <div class="tools">
        <span id="source-badge" class="badge">불러오는 중</span>
        <button type="button" id="open-file" class="tool">파일 열기</button>
        <input id="file-input" type="file" accept=".md,.markdown,text/markdown" hidden />
        <button type="button" id="theme-toggle" class="tool">테마</button>
      </div>
    </div>
  </header>
  <div id="shell" class="layout" data-status="loading">
    <nav id="toc" class="toc" aria-label="목차"></nav>
    <main>
      <article id="article"></article>
      <div id="empty-state" class="empty" hidden>
        <h2>마크다운을 찾지 못했습니다</h2>
        <p>
          같은 폴더의 마크다운을 읽으려면
          <code>python -m http.server 8080</code>으로 연 뒤
          <code>http://localhost:8080/docs.html</code>을 여세요.
          또는 오른쪽 위 <strong>파일 열기</strong>로 로컬 마크다운을 고르세요.
        </p>
      </div>
    </main>
  </div>
  <footer>
    README · PLAN · SEED · 응답곡선 · 사용자정의 마크다운을 읽는 HTML 로더입니다. 마크다운이 바뀌면 페이지를 새로고침하거나
    <code>python scripts/build_docs_html.py</code>로 내장 사본을 갱신하세요.
  </footer>
</body>
</html>
