# Centaur CTR 원본 경로 → 표준 Metric.
# 내장 mapper 가 기본 경로를 처리한다. 여기 행은 펌웨어가 다른 이름을 쓸 때
# 코드 분기 없이 흡수하기 위한 별칭이다.
#
# 실응답 4.9.2 (Centaur-6): 봉투는 `{ "<instrumentId>": { "<channel>": {value,time,units} } }`.
# Mass Position 은 `digitizer/sensor/soh/voltage#_1..3` (µV). 내장 mapper 가 읽는다.
adapter_key: nanometrics.centaur.ctr
adapter_version: "1.0"
rules:
  - firmware_range: "2.9.*"
    source_path: power/voltage
    canonical_metric_key: power.input_voltage_v
    source_unit: V
    target_unit: V
    scale: 1.0
    notes: 2.9 대에서 짧은 전원 경로로 온 관측. M-1.2 실응답으로 확정한다.

  - firmware_range: "2.9.*"
    source_path: system/systemCurrent
    canonical_metric_key: power.current_a
    source_unit: A
    target_unit: A
    scale: 1.0
    notes: 2.9 대 전류 별칭.

  - firmware_range: "*"
    source_path: gps/satellites
    canonical_metric_key: gnss.satellite_count
    notes: numberOfSatellites 대신 짧은 키를 주는 경우.
