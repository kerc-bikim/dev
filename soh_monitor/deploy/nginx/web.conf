# 관리 Web 정적 서버. SPA 이므로 알 수 없는 경로는 index.html 로 보낸다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 자산은 파일명에 해시가 붙으므로 길게 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않는다. 배포 직후 예전 화면이 남는 것을 막는다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
