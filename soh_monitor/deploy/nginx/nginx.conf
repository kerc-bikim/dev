# 중앙 Reverse Proxy.
#
# 외부에 여는 것은 443 하나뿐이다. PostgreSQL·InfluxDB 포트는 공개하지 않는다.
# Edge 는 이 지점으로만 접속하며, 중앙에서 Edge 로 들어가는 연결은 없다.

upstream soh_api {
    server api:8000;
}

upstream soh_web {
    server web:8080;
}

upstream soh_grafana {
    server grafana:3000;
}

# 업로드 폭주를 막기 위한 기본 제한. Edge Batch 크기는 계약상 5MB 이하다.
client_max_body_size 16m;

server {
    listen 80;
    server_name _;
    # 운영에서는 HTTPS 로만 접근한다. 인증서는 배포 시 마운트한다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Edge 전용 경로. 클라이언트 인증서(mTLS) 를 요구한다. ---
    # 운영에서는 아래 ssl_verify_client 두 줄을 켠다. 켜면 nginx 가
    # X-Edge-Certificate-Verify=SUCCESS 와 일련번호를 API 로 넘기고,
    # 중앙은 폐기된 serial 을 즉시 403 한다. 개발 Compose 는 CA 가 없어
    # HMAC clientToken 만으로 식별한다.
    location /api/v1/edge/ {
        # ssl_verify_client on;
        # ssl_client_certificate /etc/nginx/certs/edge-ca.crt;
        proxy_pass http://soh_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Edge-Certificate-Serial $ssl_client_serial;
        proxy_set_header X-Edge-Certificate-Verify $ssl_client_verify;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://soh_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://soh_api;
    }

    location = /readyz {
        proxy_pass http://soh_api;
    }

    location /grafana/ {
        proxy_pass http://soh_grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live 기능이 WebSocket 을 쓴다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://soh_web;
        proxy_set_header Host $host;
    }
}
