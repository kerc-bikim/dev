# 대시보드는 Git 의 JSON 을 원본으로 삼는다. Grafana UI 에서 고친 내용은
# 재배포 때 사라진다. 대시보드 변경은 저장소를 통해서만 한다.
apiVersion: 1

providers:
  - name: soh-dashboards
    orgId: 1
    folder: 관측소 SOH
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
