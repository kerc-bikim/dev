<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sniffwave 세션</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>세션은 argv 리스트로만 뜨고, 닫으면 SIGTERM</h1>
    <svg viewBox="0 0 1000 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sniff-sequence-title sniff-sequence-desc">
      <title id="sniff-sequence-title">sniffwave 세션</title>
      <desc id="sniff-sequence-desc">브라우저가 sniff 세션을 열면 FastAPI 가 sniffwave 를 Popen 하고 WebSocket 으로 줄을 보낸 뒤, 종료 시 SIGTERM 한다.</desc>
      
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      
      <line x1="160" y1="96" x2="160" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="96" x2="500" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="96" x2="840" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="496" y="148" width="8" height="300" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="196" width="8" height="232" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <rect x="132" y="280" width="736" height="112" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="132" y="280" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="154" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="184" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">[each packet]</text>

      <line x1="160" y1="152" x2="496" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="504" y1="200" x2="836" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="248" x2="496" y2="248" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="836" y1="320" x2="504" y2="320" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <line x1="496" y1="360" x2="160" y2="360" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="160" y1="424" x2="496" y2="424" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="504" y1="464" x2="836" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      
      <rect x="244.0" y="132" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="141" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /SNIFF/SESSIONS</text>

      
      <rect x="622.0" y="180" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POPEN ARGV</text>

      
      <rect x="272.0" y="228" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="237" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WS /WS/SNIFF</text>

      
      <rect x="638.0" y="300" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDOUT</text>

      
      <rect x="280.0" y="340" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="349" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEXT FRAME</text>

      
      <rect x="268.0" y="404" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="413" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELETE / CLOSE</text>

      
      <rect x="634.0" y="444" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGTERM</text>


      
      <rect x="80" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="48" width="32" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="104.0" y="57" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="160.0" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">브라우저</text>
      <text x="160.0" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">링 모니터</text>

      
      <rect x="420" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="40" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="428" y="48" width="32" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="444.0" y="57" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="500.0" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">FastAPI</text>
      <text x="500.0" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sniff broker</text>

      
      <rect x="760" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="768" y="48" width="32" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="784.0" y="57" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BIN</text>
      <text x="840.0" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">sniffwave</text>
      <text x="840.0" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ring argv</text>


      <line x1="40" y1="500" x2="960" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="40" y1="536" x2="68" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="76" y="540" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans KR', sans-serif">비동기 stdout</text>

    </svg>
  </div>
</body>
</html>
