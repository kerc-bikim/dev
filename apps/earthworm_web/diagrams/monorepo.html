<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모노레포 배포 경계</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Monorepo · Diagram Design</p>
    <h1>Docker Compose 가 앱을 묶고, EW 바이너리는 볼륨이다</h1>
    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="monorepo-title monorepo-desc">
      <title id="monorepo-title">Docker 모노레포</title>
      <desc id="monorepo-desc">루트 compose.yaml 이 apps 아래 서비스를 띄운다. Earthworm 웹이 기본이고 다른 앱은 프로필이다. Rocky 바이너리는 이미지에 넣지 않고 볼륨으로 붙인다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="40" y="24" width="920" height="56" rx="8" fill="#ececec"/>
      <text x="64" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIT</text>
      <text x="140" y="58" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">compose.yaml · apps/</text>
      <text x="920" y="58" text-anchor="end" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">profiles: ppsd · stationxml</text>

      <rect x="40" y="108" width="300" height="220" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="190" y="136" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">DEPLOY UNIT</text>
      <text x="190" y="164" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">earthworm-web</text>
      <text x="190" y="196" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">apps/earthworm_web</text>
      <text x="190" y="220" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">API + nginx :8081</text>
      <text x="190" y="252" text-anchor="middle" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', sans-serif">기본 compose up</text>
      <text x="190" y="284" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">ipc: host</text>
      <text x="190" y="308" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist', 'Noto Sans KR', sans-serif">tarball 이미지 금지</text>

      <rect x="360" y="108" width="280" height="220" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
      <text x="500" y="136" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SIBLING APPS</text>
      <text x="500" y="168" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">같은 Compose, 프로필</text>
      <text x="500" y="200" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">stationxml_manager</text>
      <text x="500" y="224" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">PPSD_v1</text>
      <text x="500" y="248" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">ringserver_…</text>
      <text x="500" y="272" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">dataselect</text>
      <text x="500" y="304" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist', 'Noto Sans KR', sans-serif">apps/ 아래, --profile</text>

      <rect x="660" y="108" width="300" height="220" rx="8" fill="#ececec"/>
      <text x="810" y="136" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HOST</text>
      <text x="810" y="168" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">EW_HOME 바이너리</text>
      <text x="810" y="200" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">Rocky Linux tarball</text>
      <text x="810" y="224" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">ew_linux.bash</text>
      <text x="810" y="248" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">startstop · q3302ew …</text>
      <text x="810" y="284" text-anchor="middle" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', sans-serif">웹 패키지에 넣지 않음</text>
      <text x="810" y="308" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist', 'Noto Sans KR', sans-serif">볼륨 · ipc: host</text>

      <line x1="340" y1="218" x2="360" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="218" x2="660" y2="218" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <text x="40" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CROSS</text>
      <text x="40" y="408" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', sans-serif">ew2ringserver · slink2ew 는 ringserver 앱과 포트만 문서에서 맞춘다. 프론트 합성은 1차에 없다.</text>
      <text x="40" y="436" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">프론트는 앱마다 빌드한다. 루트 npm workspace 로 vite 버전을 한 lock 에 묶지 않는다.</text>
    </svg>
  </div>
</body>
</html>
