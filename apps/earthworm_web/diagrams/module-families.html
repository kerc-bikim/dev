<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우선 모듈 패밀리</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Catalog · Diagram Design</p>
    <h1>팔레트는 우선 모듈, 복제 다발은 따로 표시</h1>
    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-families-title module-families-desc">
      <title id="module-families-title">우선 모듈 패밀리</title>
      <desc id="module-families-desc">구성 보드 팔레트를 데이터 프로세스, 제어, 진단 세 갈래로 나눈다. 복제 다발 다섯 모듈은 강조하고, 나머지 bin 은 추가 등록으로만 넣는다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="40" y="28" width="200" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="58" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PALETTE</text>
      <text x="140" y="80" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">우선 목록</text>

      <line x1="240" y1="64" x2="300" y2="64" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="300" y="24" width="280" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="392" y="28" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="38" text-anchor="middle" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PROCESS</text>
      <text x="440" y="64" text-anchor="middle" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">데이터 I/O</text>
      <text x="320" y="92" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">import_generic  import_pasv</text>
      <text x="320" y="112" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">tbuf2mseed  mseed2tbuf</text>
      <text x="320" y="132" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">ew2ringserver  ew2mseed</text>
      <text x="320" y="152" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">ewmseedarchiver</text>

      <rect x="316" y="176" width="248" height="188" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="440" y="204" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">FLEET</text>
      <text x="440" y="228" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">복제 다발</text>
      <text x="440" y="256" text-anchor="middle" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">q3302ew</text>
      <text x="440" y="276" text-anchor="middle" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">slink2ew</text>
      <text x="440" y="296" text-anchor="middle" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">export_scnl</text>
      <text x="440" y="316" text-anchor="middle" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">export_generic</text>
      <text x="440" y="336" text-anchor="middle" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">wave_serverV</text>
      <text x="440" y="358" text-anchor="middle" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans KR', sans-serif">인스턴스 추가가 기본</text>

      <rect x="612" y="24" width="168" height="200" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="696" y="52" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CONTROL</text>
      <text x="696" y="76" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">제어</text>
      <text x="696" y="104" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">startstop</text>
      <text x="696" y="124" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">statmgr</text>
      <text x="696" y="144" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">restart  reconfigure</text>
      <text x="696" y="164" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">pau  stopmodule</text>
      <text x="696" y="188" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">pidpau · 웹 금지</text>
      <text x="696" y="208" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans KR', sans-serif">버튼 · 필수 Process</text>

      <rect x="800" y="24" width="160" height="200" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="880" y="52" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DIAGNOSTIC</text>
      <text x="880" y="76" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">진단</text>
      <text x="880" y="104" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">status</text>
      <text x="880" y="124" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">getmenu</text>
      <text x="880" y="144" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">sniffring</text>
      <text x="880" y="164" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">sniffwave</text>
      <text x="880" y="196" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans KR', sans-serif">인스턴스 없음</text>

      <rect x="612" y="248" width="348" height="136" rx="8" fill="#ececec"/>
      <text x="786" y="280" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ON DEMAND</text>
      <text x="786" y="308" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">나머지 모듈</text>
      <text x="786" y="336" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">pick_ew · tankplayer · 그 외 bin</text>
      <text x="786" y="360" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', sans-serif">추가 등록으로만 팔레트에 등장</text>

      <text x="40" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RULE</text>
      <text x="40" y="472" fill="#2d3142" font-size="13" font-family="'Geist', 'Noto Sans KR', sans-serif">Process 만 구성 카드. 제어·진단은 버튼. 복제 다발은 같은 바이너리를 여러 이름으로 기동한다.</text>
    </svg>
  </div>
</body>
</html>
