upstream stationxml_api {
    server stationxml-api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://stationxml_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key ${STATIONXML_API_KEY};
        proxy_read_timeout 300s;
        client_max_body_size 80m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
